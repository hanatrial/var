<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Export Item Fokus Tradisional</title>
<style>
  :root{
    --ns-orange:#e8631c; --ns-orange-dark:#c9500f; --line:#ece7db; --ink:#2a2a2a; --muted:#8a8578;
    --card:#ffffff; --shell-bg:#f3efe4; --radius:14px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(40,30,10,.06);
    --shadow-md:0 6px 20px rgba(40,30,10,.08);
    --shadow-lg:0 20px 60px rgba(40,30,10,.18);
  }
  *{ box-sizing:border-box; }
  body{
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink);
    margin:0; padding:32px 16px; min-height:100vh;
    background:radial-gradient(circle at 15% 0%, #fff7ec 0%, var(--shell-bg) 55%);
  }
  #appShell{
    max-width:760px; margin:0 auto; background:var(--card); border-radius:20px;
    box-shadow:var(--shadow-md); border:1px solid var(--line); padding:28px 28px 32px;
  }
  h2{ letter-spacing:-0.01em; }

  .overlay{ position:fixed; inset:0; background:rgba(30,20,5,.5); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:999; padding:16px; }
  .overlay.show{ display:flex; }
  .detail-card{ background:#fff; border-radius:18px; max-height:85vh; overflow-y:auto; width:90%; max-width:480px; box-shadow:var(--shadow-lg); border:1px solid var(--line); }
  .detail-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); }
  .detail-body{ padding:22px; }
  .closer{ border:none; background:#f4f1e8; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--muted); transition:background .15s; }
  .closer:hover{ background:var(--line); }
  .meta{ font-size:12px; color:var(--muted); margin-top:3px; }

  @media print {
    body * { visibility:hidden; }
    #printArea, #printArea * { visibility:visible; }
    #printArea { display:block !important; position:absolute; top:0; left:0; width:100%; padding:20px; }
    .print-sales-group { page-break-before:always; }
    .print-sales-group:first-child { page-break-before:auto; }
    .print-sales-group h2 { font-size:16px; margin:0 0 4px; }
    .print-sales-group table { width:100%; border-collapse:collapse; font-size:10.5px; }
    .print-sales-group thead { display:table-header-group; }
    .print-sales-group tr { page-break-inside:avoid; }
    .print-sales-group th, .print-sales-group td { border:1px solid #ccc; padding:4px 6px; text-align:left; }
    .print-sales-group th { background:#eee; }
  }

  .toggle-btn{ padding:11px 20px; border:1px solid var(--line); background:#faf8f3; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; cursor:pointer; color:var(--ink); transition:all .15s; }
  .toggle-btn:hover{ border-color:var(--ns-orange); }
  .toggle-btn.active{ background:var(--ns-orange); border-color:var(--ns-orange); color:#fff; box-shadow:var(--shadow-sm); }
  .rtd-badge{ color:#00c000; font-weight:800; }

  /* Modern-look override for every button/select/input generated inline throughout the app,
     without needing to touch each JS template string individually. */
  button[type="button"]{
    border-radius:var(--radius-sm) !important;
    box-shadow:var(--shadow-sm) !important;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease !important;
  }
  button[type="button"]:hover{ filter:brightness(1.04); box-shadow:var(--shadow-md) !important; transform:translateY(-1px); }
  button[type="button"]:active{ transform:translateY(0); filter:brightness(.98); }
  select, input[type="text"], input[type="password"], input[type="file"]{
    border-radius:var(--radius-sm) !important;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.03) !important;
  }
</style>

<body>
<div id="appShell">

<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px;">
  <div>
    <h2 style="margin:0 0 6px; font-size:22px;">Export Item Fokus</h2>
    <p style="color:var(--muted); font-size:13px; margin:0;"><b id="dataUpdateLabel">Memuat data...</b></p>
  </div>
  <button type="button" id="openImportData" style="padding:10px 18px; border:1px solid var(--line); background:#faf8f3; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;">⇪ Import Data</button>
</div>

<div style="display:flex; gap:10px; margin-bottom:22px;">
  <button type="button" id="toggleTradisional" class="toggle-btn active">Item Fokus Tradisional</button>
  <button type="button" id="toggleModern" class="toggle-btn">Item Fokus Modern</button>
</div>

<div id="panelTradisional" style="background:#faf8f3; border:1px solid var(--line); border-radius:16px; padding:22px;">
  <button type="button" id="exportPdfAlert"
    style="padding:13px 22px; border:none; background:var(--ns-orange); color:#fff; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer;">
    Export PDF Item Fokus Tradisional
  </button>
</div>

<div id="panelModern" style="display:none; background:#faf8f3; border:1px solid var(--line); border-radius:16px; padding:22px;">
  <p style="color:var(--muted); font-size:13px; margin:0 0 16px;">18 varian item fokus (TS DiabTX/Classic, RTD, HiLo Teen/School/Active) · threshold 5 varian · 3.095 toko tercakup.</p>
  <button type="button" id="exportPdfModern"
    style="padding:13px 22px; border:none; background:var(--ns-orange); color:#fff; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer;">
    Export PDF Item Fokus Modern
  </button>
</div>

</div>

<div class="overlay" id="exportSelectOverlay">
  <div class="detail-card" id="exportSelectCard" style="max-width:460px;"></div>
</div>

<div id="printArea" style="display:none;"></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  loadStoreDataFromFirestore();
  document.getElementById('toggleTradisional').addEventListener('click', ()=>{
    document.getElementById('toggleTradisional').classList.add('active');
    document.getElementById('toggleModern').classList.remove('active');
    document.getElementById('panelTradisional').style.display = 'block';
    document.getElementById('panelModern').style.display = 'none';
  });
  document.getElementById('toggleModern').addEventListener('click', ()=>{
    document.getElementById('toggleModern').classList.add('active');
    document.getElementById('toggleTradisional').classList.remove('active');
    document.getElementById('panelModern').style.display = 'block';
    document.getElementById('panelTradisional').style.display = 'none';
  });
});
</script>

function hitungFokusCabang(s, cabang){
  const itemCabang = CABANG_ITEM_FOKUS[cabang] || [];
  const transaksi = new Set(s.items || []);
  const missing = [];
  let count = 0;
  itemCabang.forEach(item=>{
    if (transaksi.has(item)) count++;
    else missing.push(item);
  });
  return { count, total: itemCabang.length, missing };
}

function proceedToSalesSelect(cabang, start, end){
  const tokoCabang = STORE_DATA.filter(s => s.cabang === cabang);
  const eligible = tokoCabang.filter(s => {
    const c = hitungFokusCabang(s, cabang).count;
    return c >= start && c <= end;
  });

  if (!eligible.length){
    alert(`Tidak ada toko di cabang ${cabang} dengan fokus masuk ${start}–${end} varian.`);
    return;
  }
  const groups = {};
  eligible.forEach(s=>{
    const sn = s.sales || '(Tidak diketahui)';
    if (!groups[sn]) groups[sn] = [];
    groups[sn].push(s);
  });
  const salesNames = Object.keys(groups).sort();
  openExportSelect(salesNames, groups, cabang, start, end);
}

      if (groups[target]){

function generateCabangPdf(selectedSalesNames, groups, cabang, start, end){
  const threshold = end + 1;
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = selectedSalesNames.map(sn=>{
    const list = groups[sn];
    const sortedList = [...list].sort((a,b)=> hitungFokusCabang(b, cabang).count - hitungFokusCabang(a, cabang).count);
    const tableRows = sortedList.map(s=>{
      const fst = hitungFokusCabang(s, cabang);
      const rank = i => i.includes('MILKY MANGO') ? 0 : i.includes('TEA') ? 1 : 2;
      const missingSorted = [...fst.missing].sort((a,b)=> rank(a) - rank(b));
      const missingHtml = missingSorted.map(i=>{
        const label = FOCUS_ABBR[i]||i;
        if (i.includes('MILKY MANGO')) return `<span style="background:#e8631c;color:#fff;font-weight:700;padding:1px 5px;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact;">${label}</span>`;
        return i.includes('TEA') ? `<span style="color:#1a7a1a;">${label}</span>` : label;
      }).join(' / ');
      return `<tr><td>${s.toko}</td><td>${fst.count}/${threshold}</td><td>${missingHtml}</td></tr>`;
    }).join('');
    return `
      <div class="print-sales-group">
        <table>
          <thead>
            <tr><th colspan="3" style="background:#e8631c;color:#fff;font-size:13px;">${sn} — ${cabang} — ${list.length} toko (fokus masuk ${start}–${end} varian) — data update per ${DATA_UPDATE_LABEL} — dicetak ${new Date().toLocaleDateString('id-ID')}</th></tr>
            <tr><th>Nama Toko</th><th>Fokus Masuk</th><th>Belum Masuk</th></tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;
  }).join('');
  window.print();
}

function hitungFokusModern(s){
  const transaksi = new Set(s.items || []);
  const missing = [];
  let count = 0;
  FOCUS_MODERN_LIST.forEach(item=>{
    if (transaksi.has(item)) count++;
    else missing.push(item);
  });
  return { count, total: FOCUS_MODERN_LIST.length, missing };
}

function proceedToSalesSelectModern(cabang, start){
  const end = 4;
  const tokoCabang = STORE_DATA_MODERN.filter(s => s.cabang === cabang);
  const eligible = tokoCabang.filter(s=>{
    const c = hitungFokusModern(s).count;
    return c >= start && c <= end;
  });

  if (!eligible.length){
    alert(`Tidak ada toko di cabang ${cabang} dengan fokus masuk ${start}–${end} varian.`);
    return;
  }
  const groups = {};
  eligible.forEach(s=>{
    const sn = s.sales || '(Tidak diketahui)';
    if (!groups[sn]) groups[sn] = [];
    groups[sn].push(s);
  });
  const salesNames = Object.keys(groups).sort();
  openExportSelectModern(salesNames, groups, cabang, start, end);
}

function generateModernPdf(selectedSalesNames, groups, cabang, start, end){
  const threshold = 5;
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = selectedSalesNames.map(sn=>{
    const list = groups[sn];
    const sortedList = [...list].sort((a,b)=> hitungFokusModern(b).count - hitungFokusModern(a).count);
    const tableRows = sortedList.map(s=>{
      const fst = hitungFokusModern(s);
      const missingSorted = [...fst.missing].sort((a,b)=>{
        const aRtd = (FOCUS_MODERN_ABBR[a]||a).toUpperCase().includes('RTD') ? 0 : 1;
        const bRtd = (FOCUS_MODERN_ABBR[b]||b).toUpperCase().includes('RTD') ? 0 : 1;
        return aRtd - bRtd;
      });
      const missingHtml = missingSorted.map(i=>{
        const abbr = FOCUS_MODERN_ABBR[i] || i;
        const isRtd = abbr.toUpperCase().includes('RTD');
        return isRtd ? `<span class="rtd-badge">${abbr}</span>` : abbr;
      }).join(' / ');
      return `<tr><td>${s.toko}</td><td>${fst.count}/${threshold}</td><td>${missingHtml}</td></tr>`;
    }).join('');
    return `
      <div class="print-sales-group">
        <table>
          <thead>
            <tr><th colspan="3" style="background:#e8631c;color:#fff;font-size:13px;">${sn} — ${cabang} — Item Fokus Modern — ${list.length} toko (fokus masuk ${start}–${end} varian) — data update per ${DATA_UPDATE_LABEL} — dicetak ${new Date().toLocaleDateString('id-ID')}</th></tr>
            <tr><th>Nama Toko</th><th>Fokus Masuk</th><th>Belum Masuk</th></tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;
  }).join('');
  window.print();
}

/* ============================================================
   IMPORT DATA — password "NFI2026"
   Upload file .xlsx dengan kolom: CustomerSISiteGroupDesc,
   CustomerSODesc, namasalesman, ItemGroup, KeteranganInvoice, Tahun, Bulan, Tanggal
   Akan membangun ulang STORE_DATA & STORE_DATA_MODERN dari file baru,
   lalu menyimpannya ke Firestore agar tersinkron untuk semua orang.
   ============================================================ */
let DATA_UPDATE_LABEL = "Periode 1 Apr 2026 - 30 Jun 2026";

const FIRESTORE_CHUNK_SIZE = 1500; // stores per doc, stays well under 1MB/doc limit

async function loadStoreDataFromFirestore(){
  try{
    const metaSnap = await db.collection('focusData').doc('meta').get();
    if (!metaSnap.exists){ document.getElementById('dataUpdateLabel').textContent = 'Belum ada data, silakan Import Data.'; return; }
    const meta = metaSnap.data();

    const loadChunks = async (prefix, count)=>{
      const docs = await Promise.all(
        Array.from({length: count}, (_, i)=> db.collection('focusData').doc(prefix + i).get())
      );
      let out = [];
      docs.forEach(d=>{ if (d.exists) out = out.concat(JSON.parse(d.data().data)); });
      return out;
    };

    const [storeData, storeDataModern] = await Promise.all([
      loadChunks('tradisional_', meta.tradisionalChunks || 0),
      loadChunks('modern_', meta.modernChunks || 0)
    ]);

    STORE_DATA = storeData;
    STORE_DATA_MODERN = storeDataModern;
    if (meta.updateLabel){
      DATA_UPDATE_LABEL = meta.updateLabel;
      document.getElementById('dataUpdateLabel').textContent = DATA_UPDATE_LABEL;
    }
  }catch(err){
    console.error('Gagal memuat data dari cloud.', err);
    document.getElementById('dataUpdateLabel').textContent = 'Gagal memuat data cloud, coba refresh.';
  }
}

async function saveStoreDataToFirestore(storeData, storeDataModern, updateLabel, statusEl){
  const chunk = (arr, size)=>{
    const out = [];
    for (let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
    return out;
  };
  const tradisionalChunks = chunk(storeData, FIRESTORE_CHUNK_SIZE);
  const modernChunks = chunk(storeDataModern, FIRESTORE_CHUNK_SIZE);

  if (statusEl) statusEl.innerHTML = 'Menyimpan ke cloud...';

  const metaSnap = await db.collection('focusData').doc('meta').get();
  const prevMeta = metaSnap.exists ? metaSnap.data() : { tradisionalChunks: 0, modernChunks: 0 };

  const batchWrites = [];
  tradisionalChunks.forEach((c, i)=> batchWrites.push(db.collection('focusData').doc('tradisional_' + i).set({ data: JSON.stringify(c) })));
  modernChunks.forEach((c, i)=> batchWrites.push(db.collection('focusData').doc('modern_' + i).set({ data: JSON.stringify(c) })));

  // remove leftover chunk docs from a previous, larger import
  for (let i = tradisionalChunks.length; i < (prevMeta.tradisionalChunks || 0); i++){
    batchWrites.push(db.collection('focusData').doc('tradisional_' + i).delete());
  }
  for (let i = modernChunks.length; i < (prevMeta.modernChunks || 0); i++){
    batchWrites.push(db.collection('focusData').doc('modern_' + i).delete());
  }

  await Promise.all(batchWrites);
  await db.collection('focusData').doc('meta').set({
    tradisionalChunks: tradisionalChunks.length,
    modernChunks: modernChunks.length,
    updateLabel
  });
}

const loadXlsx = () => window.XLSX ? Promise.resolve() : new Promise((ok, fail)=>{ const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = ()=>fail(new Error('library xlsx gagal dimuat')); document.head.appendChild(s); });

function handleImportFile(e){
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = 'Membaca file...';
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      await loadXlsx();
      const wb = XLSX.read(evt.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:null});
      statusEl.textContent = `Memproses ${rows.length} baris...`;
      setTimeout(()=>processImportRows(rows, statusEl), 30);
    }catch(err){
      statusEl.textContent = 'Gagal membaca file: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function processImportRows(rows, statusEl){
  const storeMap = {}; // key: cabang||toko -> {cabang, toko, sales, itemsSet}
  let minDate = null;
  let maxDate = null;

  rows.forEach(r=>{
    const cabangRaw = (r['CustomerSISiteGroupDesc']||'').toString().trim();
    const toko = (r['CustomerSODesc']||'').toString().trim();
    if (!cabangRaw || !toko) return;
    const cabang = CABANG_NORMALIZE_MAP[cabangRaw] || cabangRaw;
    const key = cabang + '||' + toko;
    if (!storeMap[key]) storeMap[key] = { cabang, toko, sales: r['namasalesman']||'', itemsSet: new Set() };
    const bn = BULAN_MAP[(r['Bulan']||'').toString().trim().toUpperCase()];
    const ket = r['KeteranganInvoice'];
    if (ket !== 'RETUR'){
      const item = r['ItemGroup'];
      if (item){
        storeMap[key].itemsSet.add(item);
      }
    }
    const th = r['Tahun'];
    const tgl = r['Tanggal'];
    if (bn && th && tgl){
      const d = new Date(th, bn-1, tgl);
      if (!maxDate || d > maxDate) maxDate = d;
      if (!minDate || d < minDate) minDate = d;
    }
  });

  const allStores = Object.values(storeMap).map(s=>({ cabang:s.cabang, toko:s.toko, sales:s.sales, items:Array.from(s.itemsSet) }));

  // Rebuild STORE_DATA (Tradisional, per-cabang item list) — semua baris di file
  const newStoreData = [];
  allStores.forEach(s=>{
    const fokusItems = CABANG_ITEM_FOKUS[s.cabang];
    if (!fokusItems) return;
    const matched = s.items.filter(it => fokusItems.includes(it));
    if (!matched.length) return;
    newStoreData.push({ cabang:s.cabang, toko:s.toko, sales:s.sales, items:matched });
  });

  // Rebuild STORE_DATA_MODERN (global 18 item list)
  const newStoreDataModern = [];
  allStores.forEach(s=>{
    const matched = s.items.filter(it => FOCUS_MODERN_LIST.includes(it));
    if (!matched.length) return;
    newStoreDataModern.push({ cabang:s.cabang, toko:s.toko, sales:s.sales, items:matched });
  });

  STORE_DATA = newStoreData;
  STORE_DATA_MODERN = newStoreDataModern;
  if (minDate && maxDate){
    const fmt = d => d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
    DATA_UPDATE_LABEL = `Periode ${fmt(minDate)} - ${fmt(maxDate)}`;
    document.getElementById('dataUpdateLabel').textContent = DATA_UPDATE_LABEL;
  }

  try{
    await saveStoreDataToFirestore(newStoreData, newStoreDataModern, DATA_UPDATE_LABEL, statusEl);
    statusEl.innerHTML = `<b style="color:#1a7a1a;">Berhasil!</b> ${newStoreData.length} toko Tradisional & ${newStoreDataModern.length} toko Modern ter-update dan tersimpan ke cloud. ${DATA_UPDATE_LABEL}.`;
  }catch(err){
    statusEl.innerHTML = `<b style="color:#c0392b;">Gagal menyimpan ke cloud:</b> ${err.message}. Data tetap ter-update untuk sesi ini saja.`;
    return;
  }
  setTimeout(closeExportSelect, 2000);
}
