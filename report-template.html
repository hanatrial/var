<script>
const DATA = /*__DATA__*/;
const REGIME = /*__REGIME__*/;
const GENERATED_AT = /*__GENERATED__*/;

/* ---------- util ---------- */
const ID = (x, d=0) => (x==null? "—" : Number(x).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d}));
const RP = (x) => (x==null? "—" : "Rp "+Math.round(x).toLocaleString("id-ID"));
const CUR = (s, x) => {
  if(x==null) return "—";
  const isIDR = s && (s.cur==="IDR" || s.market==="IDX");
  if(isIDR) return "Rp "+Math.round(Number(x)).toLocaleString("id-ID");
  const dec = Math.abs(x) < 1 ? 6 : 2;
  return "$" + Number(x).toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:dec});
};
const BIG = (s, x) => { if(x==null) return "—"; const v=Number(x);
  if(s && (s.cur==="IDR" || s.market==="IDX")){ const t=v/1e12; return t>=1? "Rp "+t.toFixed(2)+" T" : "Rp "+(v/1e9).toFixed(1)+" M"; }
  const b=v/1e9; return b>=1000? "$"+(b/1000).toFixed(2)+" T" : "$"+b.toFixed(1)+" M"; };
const PCT = (x, d=2) => (x==null? "—" : (x>=0?"+":"")+Number(x).toFixed(d)+"%");
const pctf = (x, d=1) => (x==null? "—" : (x*100).toFixed(d)+"%");
/* Band jarak stop-loss (%) — SUMBER KEBENARAN TUNGGAL untuk hitung dan tampil,
   supaya angka yang ditulis di panduan tidak pernah beda dengan angka yang dihitung. */
const SL_BAND_MIN = 4, SL_BAND_MAX = 12;
const SL_MIN_LBL = SL_BAND_MIN, SL_MAX_LBL = SL_BAND_MAX;
/* Batas konsentrasi 1 nama (% modal) — dipakai bersama oleh rumus sizing DAN teks panduan. */
const POS_CAP = 0.20;
/* pembanding yang BENAR per pasar: IDX→IHSG, US→S&P 500, CRYPTO→BTC
   (sebelumnya semua pasar salah dibandingkan dengan IHSG) */
const BENCH = (mkt) => {
  const b = (REGIME && REGIME.bench && REGIME.bench[mkt]) || null;
  if (b) return b;
  // fallback untuk JSON lama yang belum punya regime.bench
  return { label: "IHSG", px: REGIME?REGIME.px:null, chg1d: REGIME?REGIME.chg1d:null,
           ma200: REGIME?REGIME.ma200:null, bearish: !!(REGIME&&REGIME.bearish) };
};
const normDiv = (x) => (x==null? null : (x<1 ? x*100 : x));

/* ---------- chart ---------- */
function drawChart(svg, series, color="#1aa35f", splits){
  const vals = series.map(p=>p.c);
  const w=320,h=130,pad=14;
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), span=(max-min)||1;
  const X = i => pad + i*(w-pad*2)/Math.max(1,(vals.length-1));
  const Y = v => (h-pad)-((v-min)/span)*(h-pad*2);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],mx=(x0+x1)/2;d+=` C ${mx.toFixed(1)} ${y0.toFixed(1)}, ${mx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)}`;}
  const area=`${d} L ${pts[pts.length-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  const up = vals[vals.length-1] >= vals[0];
  const col = up? color : "#e5484d";
  let g=`<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.3"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#gg)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  (splits||[]).forEach(sp=>{
    const td=new Date(sp.d+"T00:00:00Z").getTime();
    let bi=0,bd=Infinity;
    for(let i=0;i<series.length;i++){ const t=Math.abs(new Date(series[i].d+"T00:00:00Z").getTime()-td); if(t<bd){bd=t;bi=i;} }
    const x=X(bi).toFixed(1);
    g+=`<line x1="${x}" y1="${pad-3}" x2="${x}" y2="${h-pad}" stroke="#b7791f" stroke-width="1" stroke-dasharray="3 3"/>`;
    g+=`<text x="${x}" y="${pad-5}" fill="#b7791f" font-size="7.5" text-anchor="middle">split ${sp.ratio||""}</text>`;
  });
  svg.innerHTML=g;
}

/* ---------- analisa ---------- */
function analyze(s){
  const RP = (v)=>CUR(s, v);
  const px=s.px;
  const dv = normDiv(s.divYield);

  // ===== Verdict =====
  let verdict="";
  const cheap = s.pe!=null && s.pe>0 && s.pe<12;
  const veryCheap = s.pb!=null && s.pb<1;
  const uptrend = s.ma20&&s.ma50&&s.px>s.ma20&&s.ma20>s.ma50;
  const accum = s.accum!=null && s.accum>0.55;
  if(cheap&&uptrend&&accum) verdict="Kombinasi menarik: <b>valuasi murah</b>, <b>tren naik</b>, dan <b>indikasi akumulasi</b> — profil klasik saham yang \"belum banyak dilirik tapi mulai dikumpulkan\".";
  else if(cheap&&uptrend) verdict="Valuasi <b>murah</b> dan tren <b>naik</b>. Sinyal teknikal positif; akumulasi belum kuat, jadi butuh konfirmasi volume.";
  else if(cheap&&accum) verdict="Valuasi <b>murah</b> dengan indikasi <b>akumulasi</b>, tapi tren harga belum solid. Cocok untuk watchlist, tunggu breakout.";
  else if(uptrend) verdict="Tren <b>naik</b>, namun valuasi sudah tidak murah lagi. Momentum bagus — jaga disiplin stop-loss.";
  else verdict="Belum ada konfirmasi kuat (valuasi/tren/akumulasi). Perlakukan sebagai pantauan, bukan sinyal beli.";
  const flags = (s.score && s.score.flags) || {};
  if(flags.crash) verdict = "⚠️ Harga <b>jatuh tajam</b> (≤ −7% sehari atau ≤ −15% sepekan). Skor <b>tren &amp; momentum direset 0</b> sampai ada tanda stabilisasi — hindari menangkap \"pisau jatuh\".";
  if(flags.suspect) verdict += " ⚠️ <b>Data mencurigakan</b>: perubahan harian >25% tanpa konfirmasi volume — verifikasi ke aplikasi sekuritas (kemungkinan bug penyesuaian dividen/split).";
  if(flags.mislead) verdict += ` ℹ️ Perubahan harian dari kutipan Yahoo (${PCT(s.chg1d)}) berbeda jauh dari seri harga harian (${PCT(s.ret1d)}) — kemungkinan <b>ex-dividen</b> atau data telat.`;
  const BM = BENCH(s.market);
  if(BM && BM.chg1d!=null && s.chg1d!=null){
    const rel = s.chg1d - BM.chg1d;
    if(rel > 3) verdict += ` 📈 Hari ini <b>lebih kuat dari ${BM.label}</b> (${PCT(s.chg1d)} vs ${BM.label} ${PCT(BM.chg1d)}).`;
    else if(rel < -3) verdict += ` 📉 Hari ini <b>lebih lemah dari ${BM.label}</b> (${PCT(s.chg1d)} vs ${BM.label} ${PCT(BM.chg1d)}).`;
  }
  if(s.rsi!=null && s.rsi>72 && !flags.crash) verdict += " ⚠️ RSI sudah <b>overbought</b> — waspadai koreksi jangka pendek.";

  // ===== Fundamental =====
  const F=[];
  if(s.market==="CRYPTO"){
    F.push(`<li><b>Kapitalisasi pasar ${BIG(s,s.mcap)}</b> → ${s.mcap>5e10?"aset besar/dominan":s.mcap>5e9?"kelas menengah":"kapitalisasi kecil (lebih volatil)"}.</li>`);
    if(s.high52&&s.low52) F.push(`<li><b>Rentang 52 minggu:</b> ${CUR(s,s.low52)} – ${CUR(s,s.high52)} → harga di <b>${((s.px-s.low52)/(s.high52-s.low52)*100).toFixed(0)}%</b> dari dasar rentang.</li>`);
    F.push(`<li><b>Catatan:</b> kripto tidak punya laba/dividen — PER, PBV, ROE tidak berlaku. Penilaian berbasis tren, momentum &amp; likuiditas.</li>`);
  }
  const peW = s.pe==null? null : s.pe<=0? "negatif (perusahaan merugi)" : s.pe<8? "sangat murah" : s.pe<12? "murah" : s.pe<18? "wajar" : s.pe<25? "agak mahal":"mahal";
  if(s.pe!=null) F.push(`<li><b>PER ${s.pe.toFixed(1)}×</b> → <b>${peW}</b>. ${s.pe<12? "Pasar membayar laba dengan harga diskon.":""}</li>`);
  if(s.pb!=null) F.push(`<li><b>PBV ${s.pb.toFixed(2)}×</b> → ${s.pb<1? "di bawah nilai buku (aset lebih besar dari harga pasar)":"premium "+s.pb.toFixed(2)+"× dari nilai buku"}.</li>`);
  if(s.roe!=null) F.push(`<li><b>ROE ${pctf(s.roe)}</b> → ${s.roe>0.2?"sangat baik (efisien menghasilkan laba)":s.roe>0.12?"baik":s.roe>0.06?"cukup":"lemah"}.</li>`);
  if(s.margin!=null) F.push(`<li><b>Margin laba bersih ${pctf(s.margin)}</b> → ${s.margin>0.15?"tebal":s.margin>0.07?"sehat":"tipis"}.</li>`);
  if(s.revGrowth!=null) F.push(`<li><b>Pertumbuhan pendapatan ${pctf(s.revGrowth)}</b> (yoy) → ${s.revGrowth>0.15?"kuat":s.revGrowth>0.05?"positif":s.revGrowth>0?"stagnan":"menurun"}.</li>`);
  if(s.earnGrowth!=null) F.push(`<li><b>Pertumbuhan laba ${s.earnGrowth!=null?pctf(s.earnGrowth):"—"}</b> (yoy) → ${s.earnGrowth>0.15?"kuat":s.earnGrowth>0?"positif":s.earnGrowth> -0.1?"melemah":"menurun tajam"}.</li>`);
  if(dv!=null) F.push(`<li><b>Dividen ±${dv.toFixed(2)}%</b> → ${dv>5?"tinggi (daya tarik pendapatan)":dv>3?"lumayan":"kecil"}.</li>`);
  if(s.debtToEquity!=null) F.push(`<li><b>DER ${s.debtToEquity.toFixed(0)}%</b> → ${s.debtToEquity>150?"utang relatif tinggi":s.debtToEquity>80?"utang moderat":"utang terkendali"}.</li>`);
  if(s.floatPct!=null && s.floatPct<0.15) F.push(`<li><b>Free float tipis (${(s.floatPct*100).toFixed(0)}%)</b> → harga mudah digerakkan, rawan pola \"gorengan\".</li>`);
  if(s.exDiv) F.push(`<li><b>📅 Ex-dividen:</b> ${s.exDiv} — di hari ex, harga turun sebesar dividen (sering memicu lonjakan semu di data Yahoo).</li>`);
  if(flags.commodity) F.push(`<li><b>Catatan sektor komoditas:</b> untuk energi/material/perkebunan, <b>PER rendah sering menandai puncak siklus</b> harga komoditas, bukan \"murah\". Valuasi sengaja dibobot separuh — pantau harga komoditasnya.</li>`);
  if(flags.illiquid) F.push(`<li><b>Likuiditas rendah:</b> nilai transaksi &lt; Rp5 miliar/hari → sulit masuk/keluar tanpa menggerakkan harga. Skor dipotong 30%.</li>`);
  if(s.fxConverted) F.push(`<li><b>💱 Mata uang laporan ${s.finCur||"asing"}:</b> nilai buku/EPS dikonversi ke ${s.cur||"IDR"} dengan kurs Yahoo sebelum PBV/PER dihitung (tanpa ini, PBV bisa salah ribuan kali).</li>`);

  // ===== Teknikal =====
  const T=[];
  if(s.ma20&&s.ma50&&s.ma200){
    let st = px>s.ma20&&s.ma20>s.ma50&&s.ma50>s.ma200 ? "sangat sehat (harga > MA20 > MA50 > MA200)"
           : px>s.ma20&&s.ma20>s.ma50 ? "naik (di atas MA20 & MA50)"
           : px<s.ma20&&s.ma20<s.ma50 ? "turun (di bawah MA20 & MA50)" : "sideways/campuran";
    T.push(`<li><b>Struktur tren:</b> ${st}.</li>`);
  }
  if(s.rsi!=null){ let z = s.rsi<30?"oversold (potensi rebound)":s.rsi<45?"lemah":s.rsi<55?"netral":s.rsi<68?"bullish sehat":"overbought (>70)"; T.push(`<li><b>RSI ${s.rsi.toFixed(0)}</b> → ${z}.</li>`);}
  if(s.mfi!=null){ let z = s.mfi<20?"uang keluar sangat deras (oversold)":s.mfi<50?"aliran uang lemah":s.mfi<80?"aliran uang masuk sehat":"uang masuk berlebihan (rawan jenuh)"; T.push(`<li><b>MFI ${s.mfi.toFixed(0)}</b> → ${z}.</li>`);}
  if(s.ret1m!=null) T.push(`<li><b>Return 1 bulan ${PCT(s.ret1m)}</b>, <b>3 bulan ${PCT(s.ret3m)}</b>, <b>6 bulan ${PCT(s.ret6m)}</b> → momentum ${s.ret3m>10?"kuat":s.ret3m>0?"positif":"negatif"}.</li>`);
  if(s.offHigh!=null) T.push(`<li><b>Posisi vs high 20-hari:</b> ${s.offHigh.toFixed(1)}% → ${s.offHigh>-3?"menempel resistance, awas breakout/pullback":"masih ada ruang naik ke resistance"}.</li>`);

  // ===== Bandar =====
  const B=[];
  if(s.accum!=null){ let z = s.accum>0.6?"akumulasi kuat":s.accum>0.55?"akumulasi":s.accum>0.45?"netral (seimbang)":"distribusi (lebih banyak dijual)"; B.push(`<li><b>Rasio akumulasi ${(s.accum*100).toFixed(0)}%</b> → ${z}. Volume hari naik vs hari turun 20 hari terakhir.</li>`);}
  if(s.obv!=null) B.push(`<li><b>OBV (On-Balance Volume):</b> ${s.obv>0.15?"cenderung naik — volume menumpuk di hari kenaikan":s.obv>0?"sedikit naik":"cenderung turun — tekanan jual"}.</li>`);
  if(s.volSpike!=null) B.push(`<li><b>Volume hari ini ${s.volSpike.toFixed(2)}× rata-rata</b> → ${s.volSpike>2?"lonjakan besar, cek berita/korporasi":s.volSpike>1.4?"di atas normal":"normal"}.</li>`);
  const avgVol = s.avgVol||0;
  B.push(`<li><b>Likuiditas:</b> rata-rata volume ${avgVol>1e7?"sangat likuid":avgVol>3e6?"likuid":avgVol>1e6?"cukup":"tipis"} (${ID(avgVol/1e6,1)} jt/hari).</li>`);

  // ===== Level =====
  const supports=[s.lo20, s.ma50, s.ma200].filter(x=>x!=null&&x<px).sort((a,b)=>b-a);
  const support1 = supports[0] || px*0.95;
  const support2 = supports[1] || support1*0.95;
  const res1 = s.hi20 && s.hi20>px ? s.hi20 : px*1.03;
  const res2 = s.high52 && s.high52>res1 ? s.high52 : res1*1.05;
  // Stop-loss punya DASAR, bukan angka sembarang: 3% di bawah support terdekat
  // (support ditembus → thesis batal). Jaraknya dibendung ke band 4%–12% agar
  // konsisten dengan panduan risiko (−8% s/d −10%). Dua kasus ekstrem ditangani:
  //   • support < 3% dari harga → stop terlalu rapat, sering kena noise, dan
  //     rumus ukuran posisi (risiko tetap / jarak) akan menghasilkan posisi bengkak;
  //   • support sangat jauh     → risiko per trade melebihi toleransi.
  // Bila dibendung, batas band itulah yang dipakai DAN alasannya ditampilkan.
  const SL_MIN = SL_BAND_MIN, SL_MAX = SL_BAND_MAX;             // persen — lihat konstanta global
  let sl = support1*0.97;
  let slBasis = "3% di bawah support terdekat";
  let slClamped = false;
  if (sl > px*(1 - SL_MIN/100)) { sl = px*(1 - SL_MIN/100); slBasis = `support hanya ${(100*(1-support1/px)).toFixed(1)}% di bawah harga → SL dibatasi ${SL_MIN}%`; slClamped = true; }
  else if (sl < px*(1 - SL_MAX/100)) { sl = px*(1 - SL_MAX/100); slBasis = `support ${(100*(1-support1/px)).toFixed(1)}% di bawah harga → SL dibatasi ${SL_MAX}%`; slClamped = true; }
  let entryTxt;
  if(s.rsi!=null && s.rsi>72) entryTxt = `Harga sudah panas (RSI ${s.rsi.toFixed(0)}). Lebih baik <b>tunggu koreksi</b> ke area ${CUR(s,s.ma20||support1)} (MA20) atau ${CUR(s,support1)} sebelum masuk.`;
  else if(s.offHigh!=null && s.offHigh>-2) entryTxt = `Harga menempel resistance ${CUR(s,res1)}. <b>Entry saat breakout</b> di atas ${CUR(s,res1)} dengan volume besar, atau beli saat pullback ke ${CUR(s,s.ma20||support1)}.`;
  else entryTxt = `Bisa <b>entry bertahap</b> di area ${CUR(s,Math.min(s.ma20||px, px))}–${CUR(s,support1)} selama tren naik bertahan, atau saat breakout ${CUR(s,res1)}.`;
  const rr = (px > 0 && (px - sl) > 0) ? Math.max(0, (res1 - px)) / (px - sl) : null;  // null = N/A (jangan render "1 : 0.0")

  // ===== Exit Plan =====
  const entryRef = (s.rsi!=null && s.rsi>72 && s.ma20) ? s.ma20 : px;
  const entry2 = Math.min(s.ma20||entryRef, entryRef);
  const tp1 = res1;
  const tp2 = res2;
  const tp3 = res2*1.08;
  const slPct = ((entry2 - sl)/entry2)*100;
  const portVal = (s.cur==="IDR") ? 10000000 : 10000;
  const riskAmt = portVal*0.01;                  // risiko 1% dari modal per trade
  const rawPos = riskAmt / Math.max(0.0001,(entry2 - sl)/entry2);
  const MAXPOS = portVal*POS_CAP;                  // batas konsentrasi 1 nama (lihat konstanta global)
  const posSize = Math.min(rawPos, MAXPOS);
  const posCapped = rawPos > MAXPOS;
  const exit = { entry2, entryRef, tp1, tp2, tp3, slPct, posSize, portVal, riskAmt, slBasis, slClamped, posCapped, sl, rr };

  // ===== Risiko =====
  const a_slNote = slClamped
    ? `ℹ️ <b>Dasar stop-loss:</b> ${slBasis} → jarak SL ${slPct.toFixed(1)}%. Catatan: stop ini berada <i>di atas</i> support, jadi bisa tertembus oleh noise sebelum thesis benar-benar batal.`
    : `ℹ️ <b>Dasar stop-loss:</b> ${slBasis} → jarak SL ${slPct.toFixed(1)}% (di bawah support teknikal; bila ditembus → thesis batal).`;
  const RISK=[];
  const RF=(s.score&&s.score.flags)||{};
  if(a_slNote) RISK.push(a_slNote);
  if(RF.crash) RISK.push("⚠️ <b>Sedang jatuh tajam</b> — tren &amp; momentum direset. Tunggu 2–3 hari tanpa low baru sebelum masuk.");
  if(RF.suspect) RISK.push("⚠️ <b>Data mencurigakan</b> (lonjakan &gt;25% tanpa volume) — verifikasi ke aplikasi sekuritas sebelum bertindak.");
  if(RF.commodity) RISK.push("Sektor komoditas: harga saham mengikuti harga komoditas, bukan PER. PER rendah bisa menyesatkan.");
  if(RF.illiquid) RISK.push("Likuiditas tipis — spread lebar, sulit keluar saat pasar sedang buruk.");
  const RB = BENCH(s.market);
  if(RB && RB.bearish){
    const lvl = (RB.ma200!=null && RB.px!=null && RB.ma200>0)
      ? ` (${RB.label} di bawah MA200)` : "";
    RISK.push(`<b>Rezim ${s.market==="IDX"?"pasar bearish":s.market==="US"?"pasar AS bearish":"crypto bearish"}</b>${lvl} — peluang tiap sinyal lebih kecil; kurangi ukuran posisi.`);
  }
  if(s.market!=="IDX" && REGIME && REGIME.us && REGIME.us.riskOff)
    RISK.push("<b>Risk-off global</b> (S&amp;P 500 di bawah MA200 / VIX &gt;30) — aset berisiko tertekan; skor sudah otomatis dikali 0,90.");
  if(s.rsi!=null && s.rsi>70) RISK.push("RSI overbought — rawan koreksi jangka pendek.");
  if(s.earnGrowth!=null && s.earnGrowth<0) RISK.push("Laba sedang menurun (earnings growth negatif) — waspadai <i>value trap</i>.");
  if(s.revGrowth!=null && s.revGrowth<0) RISK.push("Pendapatan turun — permintaan melemah.");
  if(s.accum!=null && s.accum<0.45) RISK.push("Indikasi distribusi (tekanan jual lebih besar).");
  if(s.debtToEquity!=null && s.debtToEquity>150) RISK.push("Beban utang relatif tinggi (DER >150%).");
  if(avgVol<2e6) RISK.push("Likuiditas tipis — harga mudah bergerak liar & sulit keluar.");
  if(s.mfi!=null && s.mfi>85) RISK.push("Aliran uang jenuh (MFI >85) — bisa berbalik.");
  if(!RISK.length) RISK.push("Tidak ada bendera merah mencolok, tapi tetap gunakan stop-loss.");

  return {verdict, F, T, B, support1, support2, res1, res2, sl, rr, entryTxt, RISK, dv, exit};
}

/* ---------- berita ---------- */
// Klasifikasi kata kunci (negatif/positif) + skor sentimen -10..+10 dengan bobot umur berita
const NEWS_POS = ["buyback","treasuri","treasury","share repurchase","dividen naik","naikkan dividen","raises dividend","dividend increase","kontrak baru","laba melonjak","laba naik","cetak laba","beat estimates","beats estimates","raises guidance","record revenue","masuk indeks","masuk bursa","join s&p 500","melonjak","cuan","untung","tumbuh","melesat","menguat","rekomendasi beli","target harga naik","price target raised","prospek","inflow","net buy","rekor","ekspansi","akuisisi"," mengakuisisi","diakuisisi","bullish","surge","rally","gain","profit","upgrade","etf approval","etf inflows","mainnet","token burn"];
const NEWS_NEG = ["suspensi","suspend","pkpu","pailit","bangkrut","bankruptcy","chapter 11","going concern","rights issue","private placement","secondary offering","follow-on offering","at-the-market","convertible notes","lock-up expir","restatement","auditor resign","delisting","delist","below $1","bid price deficiency","fca","papan pemantauan","gagal bayar","audit disclaimer","opini disclaimer","gagal","anjlok","rugi","misses estimates","cuts guidance","koreksi","dilepas","cabut","outflow","net sell","melemah","tekanan","phk","sanksi","utang","sengketa","default","jeblok","merah","bearish","crash","dump","plunge","turun","penurunan","downgrade","hack","exploit","depeg","token unlock","monitoring tag","rug pull","honeypot"];
function newsHit(x, keys){ let c=0; keys.forEach(k=>{ if(new RegExp("(^|[^a-z0-9])"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)","i").test(x)) c++; }); return c; }
// hanya berita yang benar-benar menyebut emiten (ticker / kata nama unik) yang dinilai —
// judul "Rekomendasi: MYOR, BSDE, PWON" tidak lagi menaikkan skor ketiganya
const NEWS_STOP=new Set(["inc","corp","corporation","company","companies","group","holdings","holding","technology","technologies","limited","plc","sa","ltd","nv","ag","co","intl","international","global","digital","capital","financial","systems","network","networks","labs","energy","therapeutics","pharma","bio","platforms","communication","consumer","services","tbk","pt"]);
function newsRelevant(s,t){
  const x=(t||"").toLowerCase();
  const tk=String(s.ticker||"").toLowerCase();
  if(tk && new RegExp("(^|[^a-z0-9])"+tk+"([^a-z0-9]|$)").test(x)) return true;
  const words=String(s.name||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=5&&!NEWS_STOP.has(w));
  return words.some(w=>x.includes(w));
}
function newsSent(t){
  const x=(t||"").toLowerCase(); const p=newsHit(x,NEWS_POS), n=newsHit(x,NEWS_NEG);
  return p>n?"p":n>p?"n":"u";
}
// skor sentimen -10..+10; berita <=7 hari bobot penuh, lebih tua bobot 0,5; hanya yang relevan
function newsScore(arr,s){
  let sc=0;
  arr.forEach(x=>{ if(s && !newsRelevant(s,x.title)) return;
    const c=newsSent(x.title);
    let base = c==="p"?2: c==="n"?-2: 0;
    let w=0.5;
    if(x.date){ const days=(Date.now()-new Date(x.date).getTime())/86400000; if(days<=7) w=1; }
    sc += base*w;
  });
  return Math.max(-10, Math.min(10, Math.round(sc*10)/10));
}
function newsHTML(s){
  const arr=s.news||[];
  if(!arr.length) return `<p style="font-size:.78rem;color:var(--muted)">Tidak ada berita terbaru.</p>`;
  let p=0,n=0,u=0;
  const items=arr.map(x=>{ const c=newsSent(x.title); c==="p"?p++:c==="n"?n++:u++;
    const lab=c==="p"?"Positif":c==="n"?"Negatif":"Netral";
    return `<a class="n" href="${x.link}" target="_blank" rel="noopener"><div class="t">${x.title}</div><div class="m"><span class="s ${c}">${lab}</span>${x.src?`<span>${x.src}</span>`:""}${x.date?`<span>${x.date}</span>`:""}</div></a>`;
  }).join("");
  const sc=newsScore(arr,s);
  const ch=(ico,lab,cls)=>`<span class="rchip ${cls||""}"><i>${ico}</i>${lab}</span>`;
  const head=ch("📰",arr.length+" berita")+ch("🟢",p+" positif","ok")+(n?ch("🔴",n+" negatif","bear"):"")+(u?ch("⚪",u+" netral"):"")+ch(sc>0.5?"📈":sc<-0.5?"📉":"➖","skor "+sc, sc>0.5?"ok":sc<-0.5?"bear":"");
  return `<div class="rbar">${head}</div><div class="news">${items}</div>`;
}

/* ---------- aksi korporasi / event (per pasar) ---------- */
function caHTML(s){
  const ca=s.ca||{score:0,notes:[],flags:[]};
  const sc=ca.score;
  const ch=(ico,lab,cls)=>`<span class="rchip ${cls||""}"><i>${ico}</i>${lab}</span>`;
  let chips=ch(sc>0?"➕":sc<0?"➖":"•","skor event "+(sc>0?"+":"")+sc, sc>0?"ok":sc<0?"bear":"");
  if(s.market==="IDX"){
    const a=s.arb||{};
    chips+=ch("🚦", a.limitPct!=null?("ARB ±"+a.limitPct+"% · ARA ±"+a.araPct+"%"):("batas Rp"+a.limitRp));
    if(a.isArb) chips+=ch("⛔","sentuh ARB","bear");
    if(a.streak>1) chips+=ch("🔁","ARB "+a.streak+" hari","warn");
  } else if(s.market==="US"){
    if(s.earnInDays!=null && s.earnInDays>=0) chips+=ch(s.earnInDays<=3?"⚠️":"📅","earnings "+s.earnInDays+" hari", s.earnInDays<=3?"bear":"");
    if(s.shortPct!=null) chips+=ch("📉","short "+((s.shortPct>1?s.shortPct:s.shortPct*100).toFixed(1))+"%");
    if(s.mom121!=null) chips+=ch(s.mom121>=0?"📈":"📉","mom 12-1 "+(s.mom121>=0?"+":"")+s.mom121.toFixed(1)+"%");
  } else {
    if(s.cycle) chips+=ch("🔻","fase "+s.cycle.phase);
    if(s.fng) chips+=ch("😨","F&G "+s.fng.v+" ("+s.fng.label+")");
    if(s.btcDom!=null) chips+=ch("₿","dom BTC "+s.btcDom+"%");
    if(s.ddHigh!=null) chips+=ch("📉","dari puncak "+s.ddHigh.toFixed(1)+"%");
  }
  const exc=s.excluded?ch("⛔","DIKECUALIKAN","bear"):"";
  const notes=(ca.notes&&ca.notes.length)?`<ul>${ca.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:"";
  return `<div class="rbar">${exc}${chips}</div>${notes}`;
}

/* ---------- render list ---------- */
function tags(s){
  const t=[];
  const f=(s.score&&s.score.flags)||{};
  if(s.excluded) t.push(["⛔ Dikecualikan","warn"]);
  if(s.arb && s.arb.isArb) t.push(["Sentuh ARB","warn"]);
  if(s.ca && Array.isArray(s.ca.flags)){
    const g=s.ca.flags;
    if(g.includes("buyback")) t.push(["Buyback","good"]);
    if(g.includes("tender")) t.push(["Tender offer","good"]);
    if(g.includes("insider_beli")) t.push(["Insider beli","good"]);
    if(g.includes("dilusi_potensial")) t.push(["Risiko dilusi","warn"]);
    if(g.includes("reverse_split")) t.push(["Reverse split","warn"]);
    if(g.includes("gadai")) t.push(["Gadai saham","warn"]);
    if(g.includes("ipo_baru")) t.push(["IPO baru","warn"]);
    if(g.includes("spekulatif")) t.push(["Spekulatif","warn"]);
    if(g.includes("earnings_dekat")) t.push(["Earnings dekat","warn"]);
    if(g.includes("short_tinggi")) t.push(["Short tinggi","warn"]);
    if(g.includes("subdollar")) t.push(["Di bawah $1","warn"]);
    if(g.includes("waspada_bursa")) t.push(["Waspada bursa","warn"]);
    if(g.includes("arbToday")) t.push(["ARB hari ini","bad"]);
    if(g.includes("valueTrap")) t.push(["Value trap","bad"]);
    if(g.includes("bearishRegime")) t.push(["Rezim bearish","warn"]);
  }
  if(f.crash) t.push(["⚠ Turun tajam","warn"]);
  if(f.suspect) t.push(["⚠ Data mencurigakan","warn"]);
  if(f.mislead) t.push(["Data tak konsisten","warn"]);
  if(f.illiquid) t.push(["Illikuid","warn"]);
  if(f.commodity) t.push(["Komoditas","bandar"]);
  if(s.pe!=null&&s.pe>0&&s.pe<10&&!f.commodity) t.push(["Murah","good"]);
  if(s.pb!=null&&s.pb<1) t.push(["< PBV","good"]);
  if(s.px>s.ma20&&s.ma20>s.ma50&&!f.crash) t.push(["Tren naik","trend"]);
  if(s.ma50>s.ma200&&!f.crash) t.push(["Golden cross","trend"]);
  if(s.accum>0.58) t.push(["Akumulasi","bandar"]);
  if(s.volSpike>1.5) t.push(["Vol spike","bandar"]);
  if(s.mfi!=null&&s.mfi>60&&s.mfi<85) t.push(["Uang masuk","bandar"]);
  if(s.rsi!=null&&s.rsi>70) t.push(["Overbought","warn"]);
  const TB = BENCH(s.market);
  if(TB && TB.chg1d!=null && s.chg1d!=null){
    const rel = s.chg1d - TB.chg1d;
    if(rel > 3) t.push(["Kuat vs "+TB.label,"good"]);
    else if(rel < -3) t.push(["Lemah vs "+TB.label,"warn"]);
  }
  if(s.score && s.score.rel>=9) t.push(["Unggul 1 bln vs "+TB.label,"good"]);
  else if(s.score && s.score.rel<=0 && s.score.rel!=null) t.push(["Tertinggal 1 bln","warn"]);
  if(s.fxConverted) t.push(["Laporan non-IDR","warn"]);
  return t;
}

/* ---------- BEST BUY ---------- */
const BB_MIN={IDX:80,US:90,CRYPTO:85};
function bestBuy(s){
  const min=BB_MIN[s.market]!=null?BB_MIN[s.market]:80;
  const f=(s.score&&s.score.flags)||{}, cf=(s.ca&&s.ca.flags)||[];
  const BM=BENCH(s.market);
  const good=[],blocks=[],warns=[];
  if(BM&&BM.bearish) blocks.push(`${BM.label} di bawah MA200 (rejim bearish)`);
  else good.push(`${BM.label} di atas MA200 (rejim sehat)`);
  if(s.market==="IDX"&&REGIME&&REGIME.ma50&&REGIME.px<REGIME.ma50) blocks.push("IHSG di bawah MA50");
  if(s.score.total>=min) good.push(`Skor ${s.score.total} ≥ ambang ${min}`); else blocks.push(`Skor ${s.score.total} < ambang ${min}`);
  const nearHigh = (s.high52&&s.high52>0)?s.px/s.high52:null;
  if(nearHigh!=null && nearHigh>=0.94) good.push(`Dekat/cetak high 52 minggu (${(nearHigh*100).toFixed(0)}% dari puncak)`);
  else blocks.push(nearHigh!=null?`Jauh dari high 52 minggu (${(nearHigh*100).toFixed(0)}% dari puncak, butuh ≥94%)`:"Data high 52 minggu tak ada");
  const vs = (s.volSpike!=null)?s.volSpike:(s.score.bandar>=15?1.6:null);
  const volOK = vs!=null && vs>=1.5;
  if(volOK) good.push(`Volume ${vs.toFixed(1)}× rata-rata (≥1,5×) — konfirmasi masuk`);
  else warns.push(vs!=null?`Volume ${vs.toFixed(1)}× (<1,5×) — tunggu lonjakan volume sebelum entry`:"Volume belum terkonfirmasi");
  if(s.score.trend>=20) good.push("Tren kuat (≥20/28)"); else blocks.push("Tren lemah (<20/28)");
  if(s.score.rel>=8) good.push(`Kekuatan relatif kuat vs ${BM.label} (≥8/12)`); else blocks.push("Kekuatan relatif lemah (<8/12)");
  if(s.excluded) blocks.push("Dikecualikan screener");
  if(f.crash) blocks.push("Sedang turun tajam");
  if(f.suspect) blocks.push("Data harian mencurigakan");
  if(f.illiquid) blocks.push("Likuiditas tipis");
  if(cf.includes("valueTrap")) blocks.push("Terindikasi value trap");
  if(cf.includes("arbToday")) blocks.push("ARB hari ini");
  if(f.arbToday||(s.arb&&s.arb.isArb)) blocks.push("Menyentuh ARB");
  if(cf.includes("dilusi_potensial")) blocks.push("Risiko dilusi");
  if(cf.includes("reverse_split")) blocks.push("Reverse split");
  if(cf.includes("gadai")) blocks.push("Gadai saham pengendali");
  if(cf.includes("earnings_dekat")) blocks.push("Earnings ≤3 hari lagi");
  if(cf.includes("waspada_bursa")||cf.includes("spekulatif")) blocks.push("Status bursa berisiko");
  if(f.usRiskOff) blocks.push("Risk-off global");
  if(s.rsi!=null&&s.rsi>72) warns.push(`RSI ${s.rsi.toFixed(0)} overbought — tunggu koreksi`);
  if(s.mfi!=null&&s.mfi>85) warns.push(`MFI ${s.mfi.toFixed(0)} jenuh`);
  return {ok:blocks.length===0&&volOK, ready:blocks.length===0, volOK, good, blocks, warns, min, bench:BM?BM.label:s.market};
}

/* ---------- SINYAL BACKTEST — hanya IDX (aturan "breakout momentum", engine backtest-saham-idx, versi 5 saham) ----------
   Entry: sinyal di close, beli di open besok. Skor/valuasi TIDAK dipakai di sini karena tidak bisa diuji historis.
   Uji silang (2015–2026): 222 saham ≈ +38%/th · 912 saham ≈ +40%/th (DD −23…−30%). Tahun lemah: 2015, 2023, 2026. */
const BT={ volX:2, brk:55, mom:20, ext:40, dayMax:20, gapMax:5, hardStop:10, tp:100, exitMA:50, timeDays:40, timeMin:3, N:5, liq:2e9, minPx:200, cool:20 };
function btIdx(s){
  if(!s || s.market!=="IDX") return null;
  const R=REGIME||{};
  const regOK = R.px!=null && R.ma20!=null && R.ma200!=null && R.px>R.ma20 && R.ma20>R.ma200;
  const trendOK = s.ma50!=null && s.ma100!=null && s.ma200!=null && s.ma200Prev!=null && s.px>s.ma50 && s.ma50>s.ma100 && s.ma200>s.ma200Prev;
  const brkOK = s.hi55!=null && s.px>=s.hi55;
  const vs = s.volSpike;
  const volOK = vs!=null && vs>=BT.volX;
  const ext = (s.ma20!=null && s.ma20>0) ? (s.px/s.ma20-1)*100 : null;
  const momOK = s.ret120!=null && s.ret120>=BT.mom && ext!=null && ext<=BT.ext && s.chg1d!=null && s.chg1d<=BT.dayMax;
  const liqOK = s.turnover!=null && s.turnover>=BT.liq && s.px>=BT.minPx && !s.ipoBaru;
  const labaOK = s.eps!=null && s.eps>0;
  const checks=[
    {k:"Rejim: IHSG &gt; MA20 &amp; MA20 &gt; MA200", neg:"IHSG belum &gt; MA20 &amp; MA20 belum &gt; MA200", ok:regOK,
     v: R.px!=null?`IHSG ${ID(R.px)} · MA20 ${R.ma20!=null?ID(R.ma20):"—"} · MA200 ${R.ma200!=null?ID(R.ma200):"—"}`:"data rejim tidak tersedia"},
    {k:"Tren: harga &gt; MA50 &gt; MA100 &amp; MA200 naik (vs 20 hari lalu)", neg:"struktur tren belum lengkap (harga &gt; MA50 &gt; MA100, MA200 naik)", ok:trendOK,
     v: (s.ma50!=null&&s.ma100!=null)?`harga ${CUR(s,s.px)} · MA50 ${CUR(s,s.ma50)} · MA100 ${CUR(s,s.ma100)} · MA200 ${(s.ma200!=null&&s.ma200Prev!=null&&s.ma200>s.ma200Prev)?"naik":"tidak naik / data kurang"}`:"MA100/MA200 belum tersedia"},
    {k:"Breakout 55 hari (harga ≥ high tertinggi 55 hari)", neg:"harga belum tembus high 55 hari", ok:brkOK,
     v: s.hi55!=null?`${CUR(s,s.px)} vs high 55 hari ${CUR(s,s.hi55)} (${((s.px/s.hi55-1)*100).toFixed(1)}%)`:"high 55 hari belum tersedia"},
    {k:`Volume ≥ ${BT.volX.toFixed(1)}× rata-rata 20 hari`, neg:`volume < ${BT.volX.toFixed(1)}× rata-rata 20 hari`, ok:volOK, v: vs!=null?`${vs.toFixed(2)}×`:"volume tidak tersedia"},
    {k:`Momentum 120 hari ≥ +${BT.mom}% · tidak &gt;${BT.ext}% di atas MA20 · naik hari ini ≤${BT.dayMax}%`, neg:"momentum/ekstensi tidak memenuhi (≥+20% 120 hari, ≤40% di atas MA20, naik hari ini ≤20%)", ok:momOK,
     v: s.ret120!=null?`120 hari ${PCT(s.ret120)} · jarak MA20 ${ext!=null?PCT(ext):"—"} · hari ini ${s.chg1d!=null?PCT(s.chg1d):"—"}`:"return 120 hari belum tersedia"},
    {k:"Universe: nilai transaksi ≥ Rp2 M/hari · harga ≥ Rp200 · listing ≥ 1 tahun", neg:"universe tidak lolos (transaksi &lt; Rp2 M/hari, harga &lt; Rp200, atau IPO &lt; 1 tahun)", ok:liqOK,
     v: s.turnover!=null?`Rp ${(s.turnover/1e9).toFixed(2)} M/hari · ${CUR(s,s.px)}${s.ipoBaru?" · IPO &lt; 1 tahun":""}`:"tidak tersedia"},
    {k:"Laba bersih positif (EPS trailing &gt; 0)", neg:"laba bersih belum positif / data laba tidak tersedia", ok:labaOK,
     v: s.eps!=null?`EPS ${CUR(s,s.eps)}`:"data laba tidak tersedia"},
  ];
  const pass = checks.every(x=>x.ok);
  const ready = !pass && vs!=null && !volOK && checks.filter(x=>x.ok).length===checks.length-1;   // semua lolos kecuali volume
  return {checks, ok:pass, ready, volOK, mom:s.ret120!=null?s.ret120:null, ma50:s.ma50!=null?s.ma50:null,
          slPx:s.px*(1-BT.hardStop/100), tpPx:s.px*(1+BT.tp/100)};
}
let BT_RANK=null, BT_RN=0;
function btRankOf(s){ if(!BT_RANK){ const c=DATA.filter(x=>x.market==="IDX").filter(x=>{const b=btIdx(x);return b&&b.ok}).sort((a,b)=>(b.ret120||0)-(a.ret120||0)); BT_RANK=new Map(c.map((x,i)=>[x.ticker,i+1])); BT_RN=c.length; } return {r:BT_RANK.get(s.ticker)||null,n:BT_RN}; }
/* label kandidat: IDX pakai aturan uji, pasar lain tetap pakai skor */
function labelOf(s){ return s.market==="IDX" ? btIdx(s) : bestBuy(s); }

/* ---------- target harga fundamental (banyak metode + median sektor) ---------- */
function medianArr(a){ const b=(a||[]).filter(x=>x!=null&&isFinite(x)&&x>0).sort((x,y)=>x-y); if(!b.length) return null; const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
let _secCache={};
function sectorMedians(market){
  if(_secCache[market]) return _secCache[market];
  const by={}, allPe=[], allPb=[];
  for(const s of DATA){
    if(s.market!==market) continue;
    const k=s.sector||"Lainnya"; const o=by[k]||(by[k]={pe:[],pb:[]});
    if(s.pe!=null && s.pe>0 && s.pe<80){ o.pe.push(s.pe); allPe.push(s.pe); }
    if(s.pb!=null && s.pb>0 && s.pb<15){ o.pb.push(s.pb); allPb.push(s.pb); }
  }
  const out={sectors:{}, all:{pe:medianArr(allPe), pb:medianArr(allPb)}};
  for(const k in by) out.sectors[k]={pe:medianArr(by[k].pe), pb:medianArr(by[k].pb)};
  _secCache[market]=out; return out;
}
function fundTargets(s){
  if(s.market==="CRYPTO") return null;
  const eps=(s.eps!=null&&s.eps>0)?s.eps:null, bv=(s.bvps!=null&&s.bvps>0)?s.bvps:null;
  if(eps==null && bv==null) return null;
  const px=s.px, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const sm=sectorMedians(s.market), sec=sm.sectors[s.sector||"Lainnya"]||{};
  const secPE=(sec.pe!=null)?sec.pe:(sm.all.pe!=null?sm.all.pe:15);
  const secPB=(sec.pb!=null)?sec.pb:(sm.all.pb!=null?sm.all.pb:1.5);
  const g=(s.earnGrowth!=null)?s.earnGrowth:0, gPct=clamp(g*100,-20,40);
  const peOwn=(s.pe!=null&&s.pe>0)?s.pe:null, peGrw=clamp(8+gPct,8,25);
  const peMed=medianArr([peOwn,secPE,peGrw])||15;
  const pbOwn=(s.pb!=null&&s.pb>0)?s.pb:null, pbRoe=(s.roe!=null&&s.roe>0)?clamp(s.roe/0.12,0.5,4):null;
  const pbMed=medianArr([pbOwn,secPB,pbRoe])||1.5;
  const M=[];
  if(eps) M.push({name:`PER wajar ${peMed.toFixed(1)}× × EPS ${eps.toFixed(1)}`, val:eps*peMed});
  if(bv) M.push({name:`PBV wajar ${pbMed.toFixed(2)}× × nilai buku ${bv.toFixed(1)}`, val:bv*pbMed});
  if(eps&&bv) M.push({name:"Graham √(22,5 × EPS × BVPS)", val:Math.sqrt(22.5*eps*bv)});
  const dy=normDiv(s.divYield);
  if(dy!=null && dy>0) M.push({name:`Dividen: target imbal hasil 6% (yield kini ${dy.toFixed(1)}%)`, val:px*(dy/6)*(1+clamp(g,0,0.2))});
  if(!M.length) return null;
  M.forEach(m=>m.val=clamp(m.val, px*0.3, px*4));
  const vals=M.map(m=>m.val);
  const real=M.length>=2? vals.reduce((a,b)=>a+b,0)/vals.length : vals[0];
  const pes=M.length>=2? Math.min.apply(null,vals) : real*0.85;
  const opt=M.length>=2? Math.max.apply(null,vals) : real*1.20;
  return {methods:M, real, pes, opt, peMed, pbMed, secPE, secPB, g, dy};
}

/* ---------- komoditas induk (tren sektor sebagai proxy) ---------- */
function commodityGroup(s){
  if(s.market!=="IDX") return null;
  const ind=String(s.industry||"");
  if(/coal/i.test(ind)) return "Batubara";
  if(/oil & gas/i.test(ind)) return "Minyak & Gas";
  if(/precious metals/i.test(ind) || /gold/i.test(ind)) return "Emas & Logam Mulia";
  if(/industrial metals/i.test(ind)) return "Logam Industri (nikel/tembaga/timah)";
  if(/farm products/i.test(ind)) return "Sawit & Agri (CPO)";
  if(/paper/i.test(ind)) return "Kayu & Pulp";
  return null;
}
let _cmCache={};
function commodityBasket(g){
  if(_cmCache[g]) return _cmCache[g];
  const peers=DATA.filter(x=>x.market==="IDX" && commodityGroup(x)===g);
  const med=a=>{const b=a.filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y); if(!b.length) return null; const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2;};
  const above=peers.filter(x=>x.px!=null&&x.ma200!=null&&x.px>x.ma200).length;
  const o={ n:peers.length, ret1m:med(peers.map(x=>x.ret1m)), ret3m:med(peers.map(x=>x.ret3m)), ret6m:med(peers.map(x=>x.ret6m)), breadth: peers.length? above/peers.length : null };
  _cmCache[g]=o; return o;
}
function commodityContext(s){
  const g=commodityGroup(s); if(!g) return null;
  const b=commodityBasket(g);
  const r3=(b.ret3m!=null?b.ret3m:0), r6=(b.ret6m!=null?b.ret6m:0);
  let status="SIDEWAYS";
  if(r3>8 && r6>10) status="NAIK KUAT";
  else if(r3>2 && r6>-2) status="NAIK";
  else if(r3>-6 || r6>-15) status="SIDEWAYS";
  else status="TURUN";
  const strong = (s.score.trend>=20) && s.ma50 && s.px>s.ma50;
  let verdict, cls;
  if(status==="NAIK KUAT"||status==="NAIK"){
    if(strong){ verdict="Momentum sektor mendukung dan <b>harga saham ini sendiri sudah kuat</b> — <b>bisa dipertimbangkan masuk</b> (ikut siklus naik), tetap pakai stop-loss."; cls="ok"; }
    else { verdict="Sektor naik, tapi <b>saham ini belum kuat</b> (tren <20 atau di bawah MA50) — <b>tunggu konfirmasi harga</b> dulu."; cls="warn"; }
  } else if(status==="SIDEWAYS"){
    verdict="Kelompok komoditasnya <b>sideways</b> — <b>WAIT AND SEE</b>: tunggu sampai arah komoditas induknya jelas naik sebelum masuk."; cls="warn";
  } else {
    verdict="Kelompok komoditasnya <b>turun</b> — <b>tunggu / hindari dulu</b>. Di siklus turun, PER murah sering jebakan (value trap)."; cls="bad";
  }
  return {group:g, n:b.n, ret1m:b.ret1m, ret3m:b.ret3m, ret6m:b.ret6m, breadth:b.breadth, status, verdict, cls, strong};
}

/* ---------- tren fundamental (riwayat tahunan) ---------- */
function fundTrendHTML(s){
  const fh=s.fundHist;
  if(!fh || (!fh.eps.length && !fh.rev.length && !fh.ni.length && !fh.eq.length))
    return `<p style="font-size:.78rem;color:#6f8f80">Riwayat fundamental tahunan tidak tersedia dari sumber gratis untuk instrumen ini.</p>`;
  const ch=(ico,lab,cls)=>`<span class="rchip ${cls||""}"><i>${ico}</i>${lab}</span>`;
  const trend = a => { const v=(a||[]).map(x=>x[1]); if(v.length<2) return null; const f=v[0], l=v[v.length-1]; if(f==null||l==null||f===0) return null; const chg=(l/f-1)*100; return { n:v.length, chg, dir: l>f?"naik":l<f?"turun":"datar" }; };
  const tEps=trend(fh.eps), tRev=trend(fh.rev), tNi=trend(fh.ni);
  let roeT=null;
  if(fh.ni && fh.eq && fh.ni.length && fh.eq.length){
    const m={}; fh.eq.forEach(([y,v])=>{ if(v) m[y]=v; });
    const arr=fh.ni.filter(([y])=>m[y]).map(([y,ni])=>[y, ni/m[y]]);
    if(arr.length>=2) roeT={ y0:arr[0][0], y1:arr[arr.length-1][0], f:arr[0][1], l:arr[arr.length-1][1] };
  }
  const yrs = (tEps&&tEps.n)||(tRev&&tRev.n)||(fh.eq&&fh.eq.length)||0;
  let chips = ch("📅","riwayat "+yrs+" thn");
  const arrow = d => d==="naik"?"📈":d==="turun"?"📉":"➖";
  if(tEps) chips += ch(arrow(tEps.dir), "EPS "+(tEps.chg>=0?"+":"")+tEps.chg.toFixed(0)+"%", tEps.dir==="naik"?"ok":tEps.dir==="turun"?"bear":"");
  if(tRev) chips += ch(arrow(tRev.dir), "omzet "+(tRev.chg>=0?"+":"")+tRev.chg.toFixed(0)+"%", tRev.dir==="turun"?"warn":"");
  if(tNi)  chips += ch(arrow(tNi.dir), "laba "+(tNi.chg>=0?"+":"")+tNi.chg.toFixed(0)+"%", tNi.dir==="turun"?"bear":"");
  if(roeT) chips += ch("🧮", "ROE "+(roeT.f*100).toFixed(0)+"%→"+(roeT.l*100).toFixed(0)+"% ("+roeT.y0+"–"+roeT.y1+")", roeT.l>=roeT.f?"ok":"warn");
  const declining = (tEps&&tEps.dir==="turun") || (tNi&&tNi.dir==="turun");
  const note = declining ? `<div class="bbbox no" style="margin-top:8px"><div class="bbt">⚠️ Laba/EPS menurun beberapa tahun</div><div>Hati-hati <b>value trap</b>: PER murah bisa karena laba menyusut, bukan diskon. Cek arah komoditas/industrinya.</div></div>` : "";
  return `<div class="rbar">${chips}</div>${note}`;
}

function entryAdvice(s){
  const BM=BENCH(s.market); const px=s.px;
  const nearHigh=(s.high52&&s.high52>0)? px/s.high52 : null;
  const vs=s.volSpike, rsi=s.rsi;
  const flags=(s.score&&s.score.flags)||{};
  const sup=[s.lo20,s.ma50,s.ma200].filter(x=>x!=null&&x<px).sort((a,b)=>b-a);
  const support1=sup[0]||px*0.95;
  const sl=support1*0.97;
  const res1=(s.hi20&&s.hi20>px)? s.hi20 : px*1.03;
  const red=s.excluded||flags.crash||flags.illiquid||flags.arbToday||(s.arb&&s.arb.isArb);
  const earnSoon=s.earnInDays!=null&&s.earnInDays>=0&&s.earnInDays<=3;
  let mode,label,cls,note,order,icon;
  if(red){ mode="no"; icon="⛔"; label="HINDARI"; cls="bear"; note="Ada bendera merah (crash / ARB / illikuid / dikecualikan) — jangan buka posisi baru."; order="tidak masuk"; }
  else if(BM&&BM.bearish){ mode="wait"; icon="🕒"; label="WAIT & SEE"; cls="warn"; note=BM.label+" di bawah MA200 (rejim bearish) — sinyal beli rawan gagal. Tunggu indeks kembali di atas MA200."; order="tunggu rejim"; }
  else if(earnSoon){ mode="wait"; icon="📅"; label="TUNGGU (earnings "+s.earnInDays+" hari)"; cls="warn"; note="Risiko gap saat laporan laba — jangan masuk ≤3 hari sebelum earnings."; order="tunggu earnings"; }
  else if(nearHigh!=null&&nearHigh>=0.94&&(vs==null||vs>=1.5)&&s.score.trend>=20){
    if(rsi!=null&&rsi>72){ mode="pull"; icon="⏳"; label="TUNGGU PULLBACK"; cls="warn"; note="Sudah breakout + volume, tapi RSI overbought ("+rsi.toFixed(0)+"). Jangan kejar — tunggu koreksi ke MA20 "+CUR(s,s.ma20||support1)+"."; order="limit di MA20/support"; }
    else { mode="haka"; icon="⚡"; label="HAKA — masuk open besok"; cls="ok"; note="Breakout + volume ≥1,5× + tren kuat + rejim sehat → bisa langsung di <b>open besok</b> (market / limit kecil)."; order="market/limit di open"; }
  }
  else if(nearHigh!=null&&nearHigh>=0.94){ mode="vol"; icon="🔊"; label="TUNGGU VOLUME"; cls="warn"; note="Sudah dekat high 52 minggu (tren siap) tapi volume belum ≥1,5× — pasang alert, masuk saat volume muncul."; order="stop-buy di atas "+CUR(s,res1); }
  else { mode="brk"; icon="🚀"; label="TUNGGU BREAKOUT"; cls=""; note="Belum breakout — tunggu harga tembus <b>"+CUR(s,res1)+"</b> dengan volume ≥1,5× (jangan menebak arah)."; order="stop-buy di atas "+CUR(s,res1); }
  return {mode,icon,label,cls,note,order,entry:(mode==="haka"?px:support1),trigger:res1,sl,tp:res1};
}

/* ---------- kalender bursa (Sen–Jum; libur nasional belum dipotong) ---------- */
const NMB=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const NMRH=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const LIBUR_FIX=["01-01","05-01","08-17","12-25"];   // libur nasional bertanggal tetap
function isBursa(d){const w=d.getUTCDay();if(w===0||w===6)return false;
  return !LIBUR_FIX.includes(String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"));}
function fmtTgl(iso){if(!iso)return "—";const d=new Date(iso+"T00:00:00Z");
  return NMRH[d.getUTCDay()]+", "+d.getUTCDate()+" "+NMB[d.getUTCMonth()]+" "+d.getUTCFullYear();}
function bursaKe(iso,n){const d=new Date(iso+"T00:00:00Z");let k=0;
  while(k<n){d.setUTCDate(d.getUTCDate()+1);if(isBursa(d))k++;}return d.toISOString().slice(0,10);}
function tglClose(s){const se=(s.seriesAll&&s.seriesAll.length)?s.seriesAll:(s.series||[]);
  const iso=se.length?se[se.length-1].d:((REGIME&&REGIME.generatedAt)?String(REGIME.generatedAt).slice(0,10):null);
  if(!iso)return null;
  const d=new Date(iso+"T00:00:00Z");
  while(!isBursa(d)){d.setUTCDate(d.getUTCDate()-1);}   // mundur ke hari bursa terakhir
  return d.toISOString().slice(0,10);}

/* ---------- indikator kualitas data ----------
   Sengaja PISAHAN dari skor: skor tinggi ≠ data bagus. Membantu pengguna membedakan
   "fundamental jelek" dari "fundamental tidak terambil", dan "kalah relatif" dari
   "benchmark tidak tersedia". */
function dqHTML(s){
  const d=s.dq;
  if(!d) return `<p style="font-size:.78rem;color:var(--muted)">Ringkasan kualitas data tidak tersedia untuk instrumen ini (JSON dari sebelum indikator ini ditambahkan — jalankan ulang scraper).</p>`;
  const col = d.score>=90?"var(--lime)":d.score>=70?"#ffce6b":"var(--red)";
  const P = d.parts||{};
  const lbl = { quote:"Harga &amp; volume", chart:"Riwayat chart tersemat", fund:"Data fundamental", bench:"Benchmark tersedia", liq:"Likuiditas terhitung", clean:"Tanpa flag data bermasalah" };
  const rows = Object.keys(lbl).filter(k=>P[k]!==undefined).map(k=>{
    const v=P[k];
    const ic = v===null ? `<span style="color:var(--muted)">n/a</span>`
             : v ? `✓ <span style="color:var(--lime)">ya</span>`
                 : `✗ <span style="color:var(--red)">tidak</span>`;
    return `<div class="it"><div class="k">${lbl[k]}</div><div class="v">${ic}</div></div>`;
  }).join("");
  const iss = (d.issues&&d.issues.length)
    ? `<ul style="margin-top:8px">${d.issues.map(x=>`<li>${x}</li>`).join("")}</ul>`
    : `<p style="margin-top:8px">Tidak ada masalah data terdeteksi.</p>`;
  const upd = (REGIME && REGIME.generatedAt) ? new Date(REGIME.generatedAt).toLocaleString("id-ID") : "—";
  return `<p style="font-size:.8rem"><b style="color:${col}">${d.score}/100</b> — angka ini menilai kualitas <b>datanya</b>, bukan kualitas sahamnya.</p>
    <div class="kv">${rows}</div>${iss}
    <p style="font-size:.66rem;color:var(--muted);margin-top:8px">Grafik menampilkan <b>${d.bars!=null?d.bars:"-"} titik</b> hasil <i>downsampling</i> ±1 tahun terakhir (Yahoo Finance) — sedangkan perhitungan skor memakai riwayat penuh 5 tahun. Diambil: <b>${upd}</b>. Yahoo adalah sumber sekunder, bukan bursa resmi — verifikasi ke IDX/Nasdaq/Binance sebelum transaksi.</p>`;
}

<script>
(function(){
  var gate=document.getElementById("installGate");

  var ua=navigator.userAgent||"";

  if(!isMobile || standalone) return;                       // desktop / sudah terpasang → tidak diganggu

  var deferred=null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred=e; });
  function close(){ gate.hidden=true; }
  if(isiOS){ btn.style.display="none"; steps.style.display="block";
    steps.innerHTML="Di iPhone/iPad (<b>Safari</b>): ketuk tombol <b>Bagikan</b> \u2191 \u2192 <b>Tambahkan ke Layar Utama</b> \u2192 <b>Tambah</b>.<br><br>Kalau saat ini terbuka di dalam aplikasi lain (WA/IG), buka dulu tautannya di Safari.";
  }
  btn.addEventListener("click", async function(){

    else { steps.style.display="block"; steps.innerHTML="Kalau tak ada tombol pasang: buka menu browser \u22ee \u2192 <b>Install app</b> / <b>Tambahkan ke Layar Utama</b>."; }
  });
