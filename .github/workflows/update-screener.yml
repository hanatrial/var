name: Update screener (uji tiap 10 menit)

on:
  schedule:
    # 04:00–15:59 UTC = 12:00–23:59 WITA, Senin–Jumat, tiap 10 menit
    - cron: "*/10 4-15 * * 1-5"
  workflow_dispatch: {}

# hindari tumpukan run (yang baru menggantikan yang lama)
concurrency:
  group: update-screener
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (branch default, berisi skrip)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ambil data Yahoo & bangun halaman
        run: |
          node stock-scraper.js
          node generate-report.js

      - name: Terbitkan saham-laporan.html ke gh-pages
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" out
          cp saham-laporan.html out/saham-laporan.html
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saham-laporan.html
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan konten."
          else
            git commit -m "Auto-update screener ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Terbit."
          fi
