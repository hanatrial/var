<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Diet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a7a5a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom sempit; progres dan rencana olahraga di atas, checklist hari terpilih, lalu log per tanggal. */
:root {
  color-scheme: light;
  --bg: #eff4f1;
  --fg: #12231d;
  --muted: #566a62;
  --card: #ffffff;
  --line: #d3dfd8;
  --accent: #0a7a5a;
  --accent-soft: #d9efe6;
  --on-accent: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 1.15rem; font-weight: 800; }
.date-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.date { color: var(--muted); font-size: 0.95rem; }
.back { font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 99px; padding: 3px 12px; cursor: pointer; }
.back:focus-visible, .reset:focus-visible, .logrow:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { display: flex; flex-direction: column; gap: 14px; }
.meter { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.meter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.meter-num { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.meter-lbl { color: var(--muted); font-size: 0.9rem; text-align: right; }
.bar { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }

.plan { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.plan strong { font-family: var(--font-display); font-size: 1rem; }
.plan p { margin: 0; font-size: 0.95rem; }
.plan label { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan input[type="date"] { font: inherit; font-size: 0.9rem; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
.sec-head small { color: var(--muted); font-size: 0.82rem; display: block; font-weight: 500; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.9rem; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
ul { list-style: none; margin: 0; padding: 0; }
li + li { border-top: 1px solid var(--line); }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; cursor: pointer; min-height: 52px; }
.item input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 1px 0 0; border: 2px solid var(--muted); border-radius: 7px; background: transparent; display: grid; place-content: center; cursor: pointer; }
.item input::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--on-accent); border-bottom: 3px solid var(--on-accent); transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .12s ease; }
.item input:checked { background: var(--accent); border-color: var(--accent); }
.item input:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
.item input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.txt b { font-weight: 600; }
.txt span { color: var(--muted); font-size: 0.88rem; }
.item:has(input:checked) .txt b { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.thumb { flex: none; width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: var(--accent-soft); display: grid; place-content: center; }
.thumb svg, .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.item:has(input:checked) .thumb { opacity: .45; }
.foot { padding: 8px 16px 14px; display: flex; justify-content: flex-end; }
.reset { font: inherit; font-size: 0.85rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.reset:hover { color: var(--fg); border-color: var(--muted); }

.logrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 11px 16px; cursor: pointer; min-height: 52px; }
.logrow:hover { background: var(--accent-soft); }
.logrow[aria-current="true"] { background: var(--accent-soft); }
.log-d { font-weight: 600; min-width: 0; }
.log-d span { display: block; font-weight: 400; font-size: 0.82rem; color: var(--muted); }
.log-n { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.9rem; }
.mini { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.logrow[aria-current="true"] .mini { background: var(--card); }
.mini > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.empty { padding: 4px 16px 16px; color: var(--muted); font-size: 0.92rem; margin: 0; }
.note { color: var(--muted); font-size: 0.85rem; padding: 0 4px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar > i, .item input::after { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <h1>Checklist Diet</h1>
      <div class="date-row">
        <span class="date" id="cur-date"></span>
        <button type="button" class="back" id="back" hidden>Kembali ke hari ini</button>
      </div>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-row">
        <span class="meter-num" id="pct">0%</span>
        <span class="meter-lbl" id="pct-lbl"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i></i></div>
    </div>
    <div class="plan">
      <strong id="plan-title">Olahraga pagi</strong>
      <p id="plan-text"></p>
      <label for="start">Mulai diet
        <input type="date" id="start">
      </label>
    </div>
  </header>

  <section id="sec-daily" aria-labelledby="h-daily"></section>
  <section id="sec-log" aria-labelledby="h-log"></section>

  <p class="note">Centang tiap tanggal tersimpan di browser ini (local storage). Ketuk satu baris di log untuk melihat atau mengisi tanggal itu.</p>
</main>

  var today = dayStart(new Date());
  var cur = today;
  var START_KEY = "diet-start-v2";
  var startVal = "2026-10-30";
  try { startVal = localStorage.getItem(START_KEY) || startVal; } catch (e) {}

  function dayNum(d) { return Math.round((dayStart(d) - parse(startVal)) / 86400000) + 1; }
  function phase(n) { return n < 1 ? "Belum mulai" : n <= 3 ? "Jalan kaki" : "Lari atau padel"; }
  function longDate(d) { return HARI[d.getDay()] + ", " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); }
  function shortDate(d) { return HARI3[d.getDay()] + " " + d.getDate() + " " + BULAN3[d.getMonth()]; }

  function exerciseInfo(d) {
    var n = dayNum(d);
    var s = parse(startVal);
    var startLbl = s.getDate() + " " + BULAN3[s.getMonth()];
    if (n < 1) {
      return { title: "Olahraga pagi: jalan kaki", sub: "Diet mulai " + startLbl,
        plan: "Diet mulai " + startLbl + ". Hari 1 sampai 3 jalan kaki, hari ke-4 mulai lari, boleh diganti padel." };
    }
    if (n <= 3) {
      return { title: "Olahraga pagi: jalan kaki", sub: "Hari ke-" + n + " dari 3, lari mulai hari ke-4",
        plan: "Hari ke-" + n + ": jalan kaki. " + (n === 3 ? "Besok mulai lari." : (3 - n) + " hari lagi sebelum mulai lari.") };
    }
    return { title: "Olahraga pagi: lari atau padel", sub: "Hari ke-" + n + ", boleh gonta-ganti",
      plan: "Hari ke-" + n + ": lari, atau ganti dengan padel. Sisipkan satu hari istirahat tiap minggu." };
  }

  var state = load(dkey(cur));
  function countOf(obj) {
    var n = 0;
    DAILY.forEach(function (it) { if (obj[it.id]) n++; });
    return n;
  }

  function renderList() {
    var e = exerciseInfo(cur);
    var rows = DAILY.map(function (it) {
      var title = it.t, sub = it.s;
      if (it.dynamic) { title = e.title; sub = e.sub; }
      return '<li><label class="item"><input type="checkbox" data-id="' + it.id + '"' + (state[it.id] ? " checked" : "") + '>' +
        '<span class="thumb">' + (ICONS[it.id] || '') + '</span>' +
        '<span class="txt"><b>' + title + '</b><span>' + sub + '</span></span></label></li>';
    }).join("");
    document.getElementById("sec-daily").innerHTML =
      '<div class="sec-head"><div><h2 id="h-daily">Checklist</h2><small>' + shortDate(cur) + '</small></div>' +
      '<span class="count" id="list-count"></span></div><ul>' + rows + '</ul>' +
      '<div class="foot"><button type="button" class="reset" id="reset">Kosongkan centang tanggal ini</button></div>';
  }

  function renderLog() {
    var sec = document.getElementById("sec-log");
    var s = parse(startVal);
    var head = '<div class="sec-head"><div><h2 id="h-log">Log</h2><small>Sejak mulai diet, terbaru di atas</small></div></div>';
    if (s > today) {
      sec.innerHTML = head + '<p class="empty">Log mulai terisi tanggal ' + s.getDate() + ' ' + BULAN[s.getMonth()] + ' ' + s.getFullYear() + '.</p>';
      return;
    }
    var rows = [];
    for (var d = new Date(today); d >= s; d.setDate(d.getDate() - 1)) {
      var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      var obj = ymd(dd) === ymd(cur) ? state : load(dkey(dd));
      var done = countOf(obj);
      var isCur = ymd(dd) === ymd(cur);
      rows.push('<li><button type="button" class="logrow" data-date="' + ymd(dd) + '"' + (isCur ? ' aria-current="true"' : "") + '>' +
        '<span class="log-d">' + shortDate(dd) + '<span>Hari ke-' + dayNum(dd) + ' · ' + phase(dayNum(dd)) + '</span></span>' +
        '<span class="log-n">' + done + '/' + DAILY.length + '</span>' +
        '<span class="mini"><i style="width:' + Math.round(done / DAILY.length * 100) + '%"></i></span></button></li>');
    }
    sec.innerHTML = head + '<ul>' + rows.join("") + '</ul>';
  }

  function updateMeter() {
    var done = countOf(state), total = DAILY.length;
    var pct = Math.round(done / total * 100);
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("pct-lbl").textContent = done + " dari " + total + " target" + (ymd(cur) === ymd(today) ? " hari ini" : " tanggal ini");
    var bar = document.getElementById("bar");
    bar.setAttribute("aria-valuenow", pct);
    bar.firstElementChild.style.width = pct + "%";
    var lc = document.getElementById("list-count");
    if (lc) lc.textContent = done + "/" + total;
  }

  function renderAll() {
    document.getElementById("cur-date").textContent = longDate(cur);
    document.getElementById("back").hidden = ymd(cur) === ymd(today);
    document.getElementById("plan-text").textContent = exerciseInfo(cur).plan;
    document.getElementById("start").value = startVal;
    renderList();
    updateMeter();
    renderLog();
  }

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || !t.matches) return;
    if (t.matches('input[type="checkbox"][data-id]')) {
      var id = t.getAttribute("data-id");
      if (t.checked) state[id] = 1; else delete state[id];
      save(dkey(cur), state);
      updateMeter();
      renderLog();
    } else if (t.id === "start" && t.value) {
      startVal = t.value;
      try { localStorage.setItem(START_KEY, startVal); } catch (e) {}
      renderAll();
    }
  });

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("button") : null;
    if (!el) return;
    if (el.id === "reset") {
      state = {};
      save(dkey(cur), state);
      renderAll();
    } else if (el.id === "back") {
      cur = today;
      state = load(dkey(cur));
      renderAll();
      window.scrollTo(0, 0);
    } else if (el.hasAttribute("data-date")) {
      cur = parse(el.getAttribute("data-date"));
      state = load(dkey(cur));
      renderAll();
      window.scrollTo(0, 0);
    }
  });

  renderAll();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){});}</script>
</body>
</html>
