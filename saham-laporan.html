/* ---------- util ---------- */
const ID = (x, d=0) => (x==null? "—" : Number(x).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d}));
const RP = (x) => (x==null? "—" : "Rp "+Math.round(x).toLocaleString("id-ID"));
const CUR = (s, x) => {
  if(x==null) return "—";
  const isIDR = s && (s.cur==="IDR" || s.market==="IDX");
  if(isIDR) return "Rp "+Math.round(Number(x)).toLocaleString("id-ID");
  const dec = Math.abs(x) < 1 ? 6 : 2;
  return "$" + Number(x).toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:dec});
};
const BIG = (s, x) => { if(x==null) return "—"; const v=Number(x);
  if(s && (s.cur==="IDR" || s.market==="IDX")){ const t=v/1e12; return t>=1? "Rp "+t.toFixed(2)+" T" : "Rp "+(v/1e9).toFixed(1)+" M"; }
  const b=v/1e9; return b>=1000? "$"+(b/1000).toFixed(2)+" T" : "$"+b.toFixed(1)+" M"; };
const PCT = (x, d=2) => (x==null? "—" : (x>=0?"+":"")+Number(x).toFixed(d)+"%");
const pctf = (x, d=1) => (x==null? "—" : (x*100).toFixed(d)+"%");
const normDiv = (x) => (x==null? null : (x<1 ? x*100 : x));

/* ---------- chart ---------- */
function drawChart(svg, series, color="#cdf15c"){
  const vals = series.map(p=>p.c);
  const w=320,h=130,pad=12;
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>[pad+i*(w-pad*2)/(vals.length-1), (h-pad)-((v-min)/span)*(h-pad*2)]);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],mx=(x0+x1)/2;d+=` C ${mx} ${y0}, ${mx} ${y1}, ${x1} ${y1}`;}
  const area=`${d} L ${pts[pts.length-1][0]} ${h} L ${pts[0][0]} ${h} Z`;
  const up = vals[vals.length-1] >= vals[0];
  const col = up? color : "#ff6b6b";
  svg.innerHTML=`<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.3"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#gg)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}

  const B=[];
  if(s.accum!=null){ let z = s.accum>0.6?"akumulasi kuat":s.accum>0.55?"akumulasi":s.accum>0.45?"netral (seimbang)":"distribusi (lebih banyak dijual)"; B.push(`<li><b>Rasio akumulasi ${(s.accum*100).toFixed(0)}%</b> → ${z}. Volume hari naik vs hari turun 20 hari terakhir.</li>`);}
  if(s.obv!=null) B.push(`<li><b>OBV (On-Balance Volume):</b> ${s.obv>0.15?"cenderung naik — volume menumpuk di hari kenaikan":s.obv>0?"sedikit naik":"cenderung turun — tekanan jual"}.</li>`);
  if(s.volSpike!=null) B.push(`<li><b>Volume hari ini ${s.volSpike.toFixed(2)}× rata-rata</b> → ${s.volSpike>2?"lonjakan besar, cek berita/korporasi":s.volSpike>1.4?"di atas normal":"normal"}.</li>`);
  const avgVol = s.avgVol||0;
  B.push(`<li><b>Likuiditas:</b> rata-rata volume ${avgVol>1e7?"sangat likuid":avgVol>3e6?"likuid":avgVol>1e6?"cukup":"tipis"} (${ID(avgVol/1e6,1)} jt/hari).</li>`);

  // ===== Level =====
  const supports=[s.lo20, s.ma50, s.ma200].filter(x=>x!=null&&x<px).sort((a,b)=>b-a);
  const support1 = supports[0] || px*0.95;
  const support2 = supports[1] || support1*0.95;
  const res1 = s.hi20 && s.hi20>px ? s.hi20 : px*1.03;
  const res2 = s.high52 && s.high52>res1 ? s.high52 : res1*1.05;
  const sl = support1*0.97;
  let entryTxt;
  if(s.rsi!=null && s.rsi>72) entryTxt = `Harga sudah panas (RSI ${s.rsi.toFixed(0)}). Lebih baik <b>tunggu koreksi</b> ke area ${CUR(s,s.ma20||support1)} (MA20) atau ${CUR(s,support1)} sebelum masuk.`;
  else if(s.offHigh!=null && s.offHigh>-2) entryTxt = `Harga menempel resistance ${CUR(s,res1)}. <b>Entry saat breakout</b> di atas ${CUR(s,res1)} dengan volume besar, atau beli saat pullback ke ${CUR(s,s.ma20||support1)}.`;
  else entryTxt = `Bisa <b>entry bertahap</b> di area ${CUR(s,Math.min(s.ma20||px, px))}–${CUR(s,support1)} selama tren naik bertahan, atau saat breakout ${CUR(s,res1)}.`;
  const rr = Math.max(0,(res1-px))/Math.max(1,(px-sl));

  // ===== Exit Plan =====
  const entryRef = (s.rsi!=null && s.rsi>72 && s.ma20) ? s.ma20 : px;
  const entry2 = Math.min(s.ma20||entryRef, entryRef);
  const tp1 = res1;
  const tp2 = res2;
  const tp3 = res2*1.08;
  const slPct = ((entry2 - sl)/entry2)*100;
  const portVal = (s.cur==="IDR") ? 10000000 : 10000;
  const riskAmt = portVal*0.01;
  const posSize = riskAmt / Math.max(0.0001,(entry2 - sl)/entry2);
  const exit = { entry2, entryRef, tp1, tp2, tp3, slPct, posSize, portVal, riskAmt };

  // ===== Risiko =====
  const RISK=[];
  const RF=(s.score&&s.score.flags)||{};
  if(RF.crash) RISK.push("⚠️ <b>Sedang jatuh tajam</b> — tren &amp; momentum direset. Tunggu 2–3 hari tanpa low baru sebelum masuk.");
  if(RF.suspect) RISK.push("⚠️ <b>Data mencurigakan</b> (lonjakan &gt;25% tanpa volume) — verifikasi ke aplikasi sekuritas sebelum bertindak.");
  if(RF.commodity) RISK.push("Sektor komoditas: harga saham mengikuti harga komoditas, bukan PER. PER rendah bisa menyesatkan.");
  if(RF.illiquid) RISK.push("Likuiditas tipis — spread lebar, sulit keluar saat pasar sedang buruk.");
  if(REGIME && REGIME.bearish) RISK.push("<b>Pasar bearish</b> (IHSG di bawah MA200) — peluang tiap sinyal lebih kecil; kurangi ukuran posisi.");
  if(s.rsi!=null && s.rsi>70) RISK.push("RSI overbought — rawan koreksi jangka pendek.");
  if(s.earnGrowth!=null && s.earnGrowth<0) RISK.push("Laba sedang menurun (earnings growth negatif) — waspadai <i>value trap</i>.");
  if(s.revGrowth!=null && s.revGrowth<0) RISK.push("Pendapatan turun — permintaan melemah.");
  if(s.accum!=null && s.accum<0.45) RISK.push("Indikasi distribusi (tekanan jual lebih besar).");
  if(s.debtToEquity!=null && s.debtToEquity>150) RISK.push("Beban utang relatif tinggi (DER >150%).");
  if(avgVol<2e6) RISK.push("Likuiditas tipis — harga mudah bergerak liar & sulit keluar.");
  if(s.mfi!=null && s.mfi>85) RISK.push("Aliran uang jenuh (MFI >85) — bisa berbalik.");
  if(!RISK.length) RISK.push("Tidak ada bendera merah mencolok, tapi tetap gunakan stop-loss.");

  return {verdict, F, T, B, support1, support2, res1, res2, sl, rr, entryTxt, RISK, dv, exit};
}

/* ---------- berita ---------- */
// Klasifikasi kata kunci (negatif/positif) + skor sentimen -10..+10 dengan bobot umur berita
const NEWS_POS = ["buyback","treasuri","treasury","dividen naik","naikkan dividen","kontrak baru","laba melonjak","laba naik","cetak laba","masuk indeks","masuk bursa","melonjak","cuan","untung","tumbuh","melesat","menguat","rekomendasi beli","target harga naik","prospek","inflow","net buy","rekor","ekspansi","akuisisi","bullish","surge","rally","gain","profit","upgrade"];
const NEWS_NEG = ["suspensi","suspend","pkpu","pailit","bangkrut","rights issue","private placement","fca","papan pemantauan","gagal bayar","audit disclaimer","opini disclaimer","delisting","gagal","anjlok","rugi","koreksi","dilepas","cabut","outflow","net sell","melemah","tekanan","phk","sanksi","utang","sengketa","default","jeblok","merah","bearish","crash","dump","plunge","turun","penurunan","downgrade"];
function newsHit(x, keys){ let c=0; keys.forEach(k=>{ if(x.includes(k)) c++; }); return c; }
function newsSent(t){
  const x=(t||"").toLowerCase(); const p=newsHit(x,NEWS_POS), n=newsHit(x,NEWS_NEG);
  return p>n?"p":n>p?"n":"u";
}
// skor sentimen -10..+10; berita <=7 hari bobot penuh, lebih tua bobot 0,5
function newsScore(arr){
  let sc=0;
  arr.forEach(x=>{ const c=newsSent(x.title);
    let base = c==="p"?2: c==="n"?-2: 0;
    let w=0.5;
    if(x.date){ const days=(Date.now()-new Date(x.date).getTime())/86400000; if(days<=7) w=1; }
    sc += base*w;
  });
  return Math.max(-10, Math.min(10, Math.round(sc*10)/10));
}
function newsHTML(s){
  const arr=s.news||[];
  if(!arr.length) return `<p>Belum ada berita terbaru untuk ${s.ticker}.</p>`;
  let p=0,n=0,u=0;
  const items=arr.map(x=>{ const c=newsSent(x.title); c==="p"?p++:c==="n"?n++:u++;
    const lab=c==="p"?"Positif":c==="n"?"Negatif":"Netral";
    return `<a class="n" href="${x.link}" target="_blank" rel="noopener"><div class="t">${x.title}</div><div class="m"><span class="s ${c}">${lab}</span>${x.src?`<span>${x.src}</span>`:""}${x.date?`<span>${x.date}</span>`:""}</div></a>`;
  }).join("");
  const sc=newsScore(arr);
  const scCol = sc>0?"var(--lime)": sc<0?"var(--red)":"var(--muted)";
  const scLab = sc>0.5?"cenderung positif": sc<-0.5?"cenderung negatif":"netral";
  return `<p style="font-size:.78rem;color:var(--muted)">Sentimen: <b style="color:var(--lime)">${p} positif</b> · <b style="color:var(--red)">${n} negatif</b> · ${u} netral · <b style="color:${scCol}">skor ${sc>0?"+":""}${sc}</b> (${scLab}, dari ${arr.length} berita — berita >7 hari berbobot separuh)</p><div class="news">${items}</div>`;
}

/* ---------- aksi korporasi (IDX) ---------- */
function caHTML(s){
  if(s.market!=="IDX") return `<p>Aksi korporasi (Keterbukaan Informasi) hanya diterapkan untuk saham IDX.</p>`;
  const ca=s.ca||{score:0,notes:[],flags:[]};
  const sc=ca.score;
  const col=sc>0?"var(--lime)":sc<0?"var(--red)":"var(--muted)";
  const arb=s.arb||{};
  const lim = arb.limitPct!=null ? `ARB ±${arb.limitPct}% · ARA ±${arb.araPct}%` : `batas absolut Rp${arb.limitRp} (harga ≤ Rp10)`;
  let h=`<p style="font-size:.78rem;color:var(--muted)">Skor aksi korporasi: <b style="color:${col}">${sc>0?"+":""}${sc}</b> · Batas hari ini: <b>${lim}</b>${arb.isArb?" · ⛔ <b style=\"color:var(--red)\">menyentuh ARB hari ini</b>":""}${arb.streak>1?` · ARB ${arb.streak} hari berturut-turut`:""}.</p>`;
  if(s.excluded) h+=`<p style="color:#ff9b9b;font-weight:700">⛔ DIKECUALIKAN dari rekomendasi (status bursa / spekulatif / ARB beruntun).</p>`;
  h += (ca.notes&&ca.notes.length) ? `<ul>${ca.notes.map(n=>`<li>${n}</li>`).join("")}</ul>` : `<p>Tidak ada aksi korporasi menonjol terdeteksi dari berita terbaru.</p>`;
  h += `<p style="font-size:.66rem;color:var(--muted)">Sumber: kata kunci judul berita + riwayat dividen/split Yahoo. Halaman Keterbukaan Informasi idx.co.id tidak bisa diakses otomatis → ini <b>proxy</b>, bukan data KI resmi. Selalu verifikasi.</p>`;
  return h;
}

/* ---------- render list ---------- */
function tags(s){
  const t=[];
  const f=(s.score&&s.score.flags)||{};
  if(s.excluded) t.push(["⛔ Dikecualikan","warn"]);
  if(s.arb && s.arb.isArb) t.push(["Sentuh ARB","warn"]);
  if(s.ca && Array.isArray(s.ca.flags)){
    const g=s.ca.flags;
    if(g.includes("buyback")) t.push(["Buyback","good"]);
    if(g.includes("tender")) t.push(["Tender offer","good"]);
    if(g.includes("insider_beli")) t.push(["Insider beli","good"]);
    if(g.includes("dilusi_potensial")) t.push(["Risiko dilusi","warn"]);
    if(g.includes("reverse_split")) t.push(["Reverse split","warn"]);
    if(g.includes("gadai")) t.push(["Gadai saham","warn"]);
    if(g.includes("ipo_baru")) t.push(["IPO baru","warn"]);
    if(g.includes("spekulatif")) t.push(["Spekulatif","warn"]);
  }
  if(f.crash) t.push(["⚠ Turun tajam","warn"]);
  if(f.suspect) t.push(["⚠ Data mencurigakan","warn"]);
  if(f.mislead) t.push(["Data tak konsisten","warn"]);
  if(f.illiquid) t.push(["Illikuid","warn"]);
  if(f.commodity) t.push(["Komoditas","bandar"]);
  if(s.pe!=null&&s.pe>0&&s.pe<10&&!f.commodity) t.push(["Murah","good"]);
  if(s.pb!=null&&s.pb<1) t.push(["< PBV","good"]);
  if(s.px>s.ma20&&s.ma20>s.ma50&&!f.crash) t.push(["Tren naik","trend"]);
  if(s.ma50>s.ma200&&!f.crash) t.push(["Golden cross","trend"]);
  if(s.accum>0.58) t.push(["Akumulasi","bandar"]);
  if(s.volSpike>1.5) t.push(["Vol spike","bandar"]);
  if(s.mfi!=null&&s.mfi>60&&s.mfi<85) t.push(["Uang masuk","bandar"]);
  if(s.rsi!=null&&s.rsi>70) t.push(["Overbought","warn"]);
  if(REGIME && REGIME.chg1d!=null && s.chg1d!=null){
    const rel = s.chg1d - REGIME.chg1d;
    if(rel > 3) t.push(["Relatif kuat","good"]);
    else if(rel < -3) t.push(["Relatif lemah","warn"]);
  }
  return t;
}

    <li><b>Liquidity filter</b>: nilai transaksi &lt; Rp5 miliar/hari (IDX) dipotong skornya &amp; diberi tanda.</li>
    <li><b>Market regime</b>: jika IHSG di bawah MA200, semua hasil dibaca dengan asumsi pasar bearish.</li>
    <li><b>Batas ARB/ARA</b>: menandai saham yang menyentuh ARB; ARB 2 hari berturut-turut → dikecualikan 5 hari.</li>
    <li><b>Aksi korporasi</b>: menilai buyback/tender/insider/dilusi/dll dari berita &amp; riwayat dividen-split.</li>
  </ul>
  <h3>Aturan ARB/ARA BEI (penting — berubah 2027)</h3>
  <p>Harga minimum saham BEI turun dari Rp50 ke <b>Rp1</b> (28 Sep 2026). Batas auto reject:</p>

  <p style="margin-top:6px">Mulai 2027 saham bisa jatuh jauh lebih dalam dalam sehari. Screener menandai <b>"Sentuh ARB"</b>; <b>ARB 2 hari berturut-turut → dikecualikan selama 5 hari</b>. Contoh: PTBA −12,8% &amp; ERAA −14,6% adalah penurunan nyata yang hampir menyentuh ARB 15%.</p>
  <p>Catatan: <b>short selling</b> mulai dibuka kembali (1 Okt 2026) untuk segelintir saham LQ45 — belum ada daftar resmi yang bisa ditarik otomatis, jadi screener tidak menandai <i>shortable</i>. Untuk saham ≤ Rp10, batas ARB/ARA memakai nominal Rp1 (bukan persen).</p>
  <h3>Aksi korporasi (Keterbukaan Informasi / KI)</h3>
  <p>Bobot skor (titik awal — <b>belum divalidasi backtest</b>): buyback <b>+5…+10</b> · tender offer/go private <b>+10</b> · insider beli 30 hari <b>+8</b> · private placement strategis <b>+5</b> · rights issue <b>−10</b> (−15 bila untuk bayar utang) · private placement biasa <b>−5</b> · reverse split <b>−10</b> · gadai saham pengendali <b>−10</b> · waran in-the-money <b>−5</b>.</p>
  <p>Kata kunci yang dipantau: HMETD/rights issue · PMTHMETD/private placement · waran seri · pemecahan/penggabungan nilai nominal (split/reverse) · pembelian kembali saham (buyback) · pembagian dividen · penawaran tender/go private · perubahan pengendali/backdoor · laporan kepemilikan (insider) · gadai/penjaminan saham · panggilan RUPS/RUPSLB · PKPU/pailit/suspensi/UMA.</p>
  <p><b>Wajib dikecualikan:</b> papan pemantauan khusus (FCA), notasi khusus (ekuitas negatif, laporan terlambat, opini audit disclaimer), UMA, suspensi, PKPU/pailit; serta emiten spekulatif (perubahan pengendali) dengan kapitalisasi di bawah Rp1 T. Catatan: halaman KI di idx.co.id tidak bisa diakses otomatis, jadi deteksi memakai kata kunci berita + riwayat dividen/split Yahoo → <b>verifikasi manual wajib</b>.</p>

  <p style="margin-top:8px">Target 30%/tahun hanya realistis bila siap menerima risiko rugi 20%+ dengan peluang yang kurang lebih sama besar. <b>Target yang lebih sehat: 15–25%/tahun dengan drawdown maksimum di bawah 25%.</b> Screener bagus tidak menjamin 30% — gunanya menggeser peluang sedikit dan memotong kerugian besar lebih cepat.</p>
